<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Tạo chủ đề mới</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css" />
    <style>
        .answer-label {
            min-width: 30px;
            text-align: center;
        }

        .correct-checkbox {
            margin-right: 10px;
        }

        .error-message {
            color: #dc3545;
            font-size: 0.875em;
        }
    </style>
</head>

<body class="bg-white text-dark">
    <div class="d-flex min-vh-100">
        <!-- Sidebar -->
        <div th:replace="~{client/layout/sidebar :: sidebar}"></div>
        <!-- Main content -->
        <main class="flex-grow-1 d-flex flex-column">
            <!-- Top bar -->
            <div th:replace="~{client/layout/topbar :: topbar}"></div>

            <!-- Content grid -->
            <div class=" container center">
                <section class="flex-grow-1 overflow-auto p-4">


                    <div class="container mt-5">
                        <h2 class="mb-4">Thêm câu hỏi mới</h2>

                        <form th:action="@{/questions/add/{id}(id=${quiz.quizId})}" method="post" th:object="${questionForm}">


                            <!-- Nội dung câu hỏi -->
                            <div class="mb-3">
                                <label class="form-label">Nội dung câu hỏi</label>
                                <textarea class="form-control" th:field="*{questionText}" rows="3" required></textarea>
                                <div th:if="${#fields.hasErrors('questionText')}" class="error-message">
                                    <span th:errors="*{questionText}"></span>
                                </div>
                            </div>

                            <!-- Loại câu hỏi -->
                            <div class="mb-3">
                                <label class="form-label">Loại câu hỏi</label>
                                <select class="form-select" th:field="*{questionType}" id="questionType">
                                    <option value="SINGLE">Một đáp án đúng</option>
                                    <option value="MULTIPLE">Nhiều đáp án đúng</option>
                                </select>
                                <div th:if="${#fields.hasErrors('questionType')}" class="error-message">
                                    <span th:errors="*{questionType}"></span>
                                </div>
                            </div>

                            <!-- 4 đáp án -->
                            <div class="mb-3">
                                <label class="form-label">Các đáp án</label>

                                <!-- Đáp án A -->
                                <div class="input-group mb-2">
                                    <span class="input-group-text">
                                        <input class="form-check-input correct-checkbox" type="checkbox"
                                            th:field="*{choices[0].isCorrect}">
                                        <span class="answer-label">A</span>
                                    </span>
                                    <input type="text" class="form-control" th:field="*{choices[0].choiceText}"
                                        placeholder="Nhập đáp án A" required>
                                </div>

                                <!-- Đáp án B -->
                                <div class="input-group mb-2">
                                    <span class="input-group-text">
                                        <input class="form-check-input correct-checkbox" type="checkbox"
                                            th:field="*{choices[1].isCorrect}">
                                        <span class="answer-label">B</span>
                                    </span>
                                    <input type="text" class="form-control" th:field="*{choices[1].choiceText}"
                                        placeholder="Nhập đáp án B" required>
                                </div>

                                <!-- Đáp án C -->
                                <div class="input-group mb-2">
                                    <span class="input-group-text">
                                        <input class="form-check-input correct-checkbox" type="checkbox"
                                            th:field="*{choices[2].isCorrect}">
                                        <span class="answer-label">C</span>
                                    </span>
                                    <input type="text" class="form-control" th:field="*{choices[2].choiceText}"
                                        placeholder="Nhập đáp án C" required>
                                </div>

                                <!-- Đáp án D -->
                                <div class="input-group mb-2">
                                    <span class="input-group-text">
                                        <input class="form-check-input correct-checkbox" type="checkbox"
                                            th:field="*{choices[3].isCorrect}">
                                        <span class="answer-label">D</span>
                                    </span>
                                    <input type="text" class="form-control" th:field="*{choices[3].choiceText}"
                                        placeholder="Nhập đáp án D" required>
                                </div>
                            </div>

                            <button type="submit" class="btn btn-primary">Lưu câu hỏi</button>
                            <a th:href="@{/quizzes/detail/${quiz.quizId}}" class="btn btn-secondary ms-2">Hủy</a>
                        </form>
                    </div>

                    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
                    <script>
                        document.addEventListener('DOMContentLoaded', function () {
                            const questionType = document.getElementById('questionType');
                            const checkboxes = document.querySelectorAll('.correct-checkbox');

                            // Xử lý khi thay đổi loại câu hỏi
                            questionType.addEventListener('change', function () {
                                updateCheckboxBehavior();
                            });

                            // Xử lý khi click checkbox
                            checkboxes.forEach(checkbox => {
                                checkbox.addEventListener('change', function () {
                                    if (questionType.value === 'SINGLE' && this.checked) {
                                        // Bỏ chọn tất cả các checkbox khác
                                        checkboxes.forEach(cb => {
                                            if (cb !== this) cb.checked = false;
                                        });
                                    }
                                });
                            });

                            // Kiểm tra validate khi submit form
                            document.getElementById('questionForm').addEventListener('submit', function (e) {
                                const checkedCount = document.querySelectorAll('.correct-checkbox:checked').length;

                                if (questionType.value === 'SINGLE' && checkedCount !== 1) {
                                    e.preventDefault();
                                    alert('Câu hỏi loại "Một đáp án đúng" phải có duy nhất 1 đáp án được chọn!');
                                    return false;
                                }

                                if (questionType.value === 'MULTIPLE' && checkedCount < 1) {
                                    e.preventDefault();
                                    alert('Câu hỏi loại "Nhiều đáp án đúng" phải có ít nhất 1 đáp án được chọn!');
                                    return false;
                                }

                                return true;
                            });

                            function updateCheckboxBehavior() {
                                if (questionType.value === 'SINGLE') {
                                    // Nếu đang chọn nhiều checkbox, chỉ giữ lại cái đầu tiên
                                    const checkedBoxes = Array.from(checkboxes).filter(cb => cb.checked);
                                    if (checkedBoxes.length > 1) {
                                        checkboxes.forEach(cb => cb.checked = false);
                                        checkedBoxes[0].checked = true;
                                    }

                                    // Nếu chưa có đáp án nào được chọn, chọn đáp án đầu tiên
                                    if (checkedBoxes.length === 0 && checkboxes.length > 0) {
                                        checkboxes[0].checked = true;
                                    }
                                }
                            }

                            // Khởi tạo ban đầu
                            updateCheckboxBehavior();
                        });
                    </script>
                </section>
            </div>
        </main>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
