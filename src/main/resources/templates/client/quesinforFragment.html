<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Quiz Detail</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
    <style>
        :root {
            --primary-color: #7c3aed;
            --primary-light: #8b5cf6;
            --primary-dark: #6d28d9;
            --secondary-color: #f9fafb;
            --text-color: #334155;
            --text-light: #64748b;
            --border-color: #e2e8f0;
            --shadow-sm: 0 1px 2px 0 rgb(0 0 0 / 0.05);
            --shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1), 0 2px 4px -2px rgb(0 0 0 / 0.1);
            --shadow-md: 0 10px 15px -3px rgb(0 0 0 / 0.1), 0 4px 6px -4px rgb(0 0 0 / 0.1);
            --radius-sm: 0.5rem;
            --radius-md: 0.75rem;
            --radius-lg: 1rem;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: #f8fafc;
            color: var(--text-color);
            line-height: 1.6;
        }

        .quiz-header {
            background: linear-gradient(135deg, #f9fafb 0%, #f3f4f6 100%);
            border-radius: var(--radius-lg);
            padding: 2rem;
            margin-bottom: 2rem;
            border: 1px solid var(--border-color);
            transition: all 0.3s ease;
        }

        .quiz-header:hover {
            box-shadow: var(--shadow);
            transform: translateY(-2px);
        }

        .quiz-image {
            width: 140px;
            height: 140px;
            object-fit: cover;
            border-radius: var(--radius-md);
            border: 3px solid white;
            box-shadow: var(--shadow-sm);
        }

        .quiz-title {
            font-weight: 700;
            font-size: 1.75rem;
            color: var(--primary-dark);
            margin-bottom: 0.5rem;
        }

        .quiz-meta {
            display: flex;
            flex-wrap: wrap;
            gap: 1rem;
            margin-bottom: 1.25rem;
        }

        .meta-item {
            display: flex;
            align-items: center;
            font-size: 0.9rem;
            color: var(--text-light);
        }

        .meta-item i {
            margin-right: 0.5rem;
            color: var(--primary-color);
        }

        .btn-primary {
            background-color: var(--primary-color);
            border-color: var(--primary-color);
            padding: 0.5rem 1.5rem;
            font-weight: 500;
            letter-spacing: 0.5px;
            transition: all 0.3s ease;
        }

        .btn-primary:hover {
            background-color: var(--primary-dark);
            border-color: var(--primary-dark);
            transform: translateY(-1px);
            box-shadow: var(--shadow);
        }

        /* Rating Section */
        .rating-section {
            background-color: white;
            border-radius: var(--radius-lg);
            padding: 2rem;
            margin-bottom: 2rem;
            box-shadow: var(--shadow-sm);
            border: 1px solid var(--border-color);
        }

        .section-title {
            font-weight: 600;
            font-size: 1.25rem;
            margin-bottom: 1.5rem;
            color: var(--primary-dark);
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .section-title i {
            font-size: 1.1rem;
        }

        .avg-rating {
            display: flex;
            align-items: center;
            gap: 1rem;
            margin-bottom: 1.5rem;
        }

        .rating-number {
            font-size: 2rem;
            font-weight: 700;
            color: var(--primary-color);
        }

        .stars {
            font-size: 1.5rem;
            color: #ddd;
            position: relative;
            display: inline-block;
        }

        .stars-filled {
            color: #f59e0b;
            position: absolute;
            top: 0;
            left: 0;
            overflow: hidden;
            white-space: nowrap;
            pointer-events: none;
        }

        .star-rating {
            font-size: 1.75rem;
            cursor: pointer;
            user-select: none;
            display: inline-flex;
            margin-bottom: 1rem;
        }

        .star-rating .star {
            color: #ddd;
            transition: all 0.2s ease;
            padding: 0 0.15rem;
        }

        .star-rating .star:hover,
        .star-rating .star:hover~.star,
        .star-rating .star.active {
            color: #f59e0b;
            transform: scale(1.1);
        }

        /* Comments Section */
        .comments-section {
            background-color: white;
            border-radius: var(--radius-lg);
            padding: 2rem;
            box-shadow: var(--shadow-sm);
            border: 1px solid var(--border-color);
        }

        .comment-form {
            display: flex;
            gap: 1rem;
            margin-bottom: 2rem;
        }

        .comment-avatar {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid var(--primary-light);
        }

        .comment-input {
            flex: 1;
        }

        .comment-input textarea {
            border-radius: var(--radius-md);
            border: 1px solid var(--border-color);
            resize: none;
            transition: all 0.3s ease;
        }

        .comment-input textarea:focus {
            border-color: var(--primary-color);
            box-shadow: 0 0 0 3px rgba(124, 58, 237, 0.1);
        }

        .comment-list {
            display: flex;
            flex-direction: column;
            gap: 1.25rem;
        }

        .comment-item {
            display: flex;
            gap: 1rem;
            padding: 1.25rem;
            background-color: white;
            border-radius: var(--radius-md);
            box-shadow: var(--shadow-sm);
            border: 1px solid var(--border-color);
            transition: all 0.3s ease;
        }

        .comment-item:hover {
            transform: translateY(-2px);
            box-shadow: var(--shadow);
        }

        .comment-content {
            flex: 1;
        }

        .comment-author {
            font-weight: 600;
            color: var(--text-color);
            margin-bottom: 0.25rem;
        }

        .comment-text {
            color: var(--text-color);
            margin-bottom: 0.5rem;
            word-break: break-word;
        }

        .comment-date {
            font-size: 0.8rem;
            color: var(--text-light);
        }

        /* Responsive adjustments */
        @media (max-width: 768px) {
            .quiz-header {
                flex-direction: column;
                text-align: center;
            }
            
            .quiz-image {
                margin-bottom: 1rem;
                width: 100px;
                height: 100px;
            }
            
            .quiz-meta {
                justify-content: center;
            }
            
            .comment-form {
                flex-direction: column;
            }
            
            .comment-avatar {
                align-self: center;
            }
        }
    </style>
</head>

<body class="bg-light">
    <div class="d-flex min-vh-100">
        <div th:replace="~{client/layout/sidebar :: sidebar}"></div>
        <main class="flex-grow-1 d-flex flex-column">
            <div th:replace="~{client/layout/topbar :: topbar}"></div>

            <section class="flex-grow-1 overflow-auto p-4">
                <div class="container">
                    <div class="row justify-content-center">
                        <div class="col-12 col-lg-10 col-xl-8">
                            <!-- Quiz Header Section -->
                            <div class="quiz-header d-flex align-items-center gap-4 flex-wrap">
                                <img th:src="@{'/images/quizImages/'+${quiz.imageUrl}}" alt="Quiz image" class="quiz-image">
                                <div class="quiz-info">
                                    <h1 class="quiz-title" th:text="${quiz.title}">Quiz Title</h1>
                                    <div class="quiz-meta">
                                        <div class="meta-item">
                                            <i class="fas fa-tag"></i>
                                            <span th:text="${quiz.category?.name}">Chủ đề</span>
                                        </div>
                                        <div class="meta-item">
                                            <i class="fas fa-user"></i>
                                            <span th:text="${quiz.createdBy.username}">Tác giả</span>
                                        </div>
                                        <div class="meta-item">
                                            <i class="fas fa-calendar-alt"></i>
                                            <span th:text="${#temporals.format(quiz.createdAt, 'dd/MM/yyyy')}">01/01/2023</span>
                                        </div>
                                        <div class="meta-item">
                                            <i class="fas fa-question-circle"></i>
                                            <span th:text="${#lists.size(quiz.questions)}">0</span> câu hỏi
                                        </div>
                                        <div class="meta-item">
                                            <i class="fas fa-clock"></i>
                                            <span th:text="${quiz.timeLimitMinutes}">0</span> phút
                                        </div>
                                    </div>
                                    <a th:href="@{/quizzes/take/{quizId}/question/0(quizId=${quiz.quizId})}" class="btn btn-primary shadow-sm">
                                        <i class="fas fa-play me-2"></i>Bắt đầu làm bài
                                    </a>
                                </div>
                            </div>

                            <!-- Rating Section -->
                            <div class="rating-section">
                                <h3 class="section-title">
                                    <i class="fas fa-star"></i>Đánh giá
                                </h3>
                                
                                <div class="avg-rating">
                                    <div class="rating-number" th:text="${avgRating}">4.5</div>
                                    <div class="d-flex flex-column">
                                        <div class="stars">
                                            <span>★★★★★</span>
                                            <div class="stars-filled" th:style="'width:' + ${avgRating * 20} + '%'">★★★★★</div>
                                        </div>
                                        <small class="text-muted">Dựa trên [[${ratingCount}]] đánh giá</small>
                                    </div>
                                </div>
                                
                                <form th:action="@{/quizzes/{id}/ratings(id=${quiz.quizId})}" method="post" class="mb-4">
                                    <label class="form-label fw-medium mb-2">Đánh giá của bạn:</label>
                                    <div class="d-flex align-items-center gap-3 flex-wrap">
                                        <div class="star-rating">
                                            <input type="hidden" name="rating" id="rating-value" th:value="${userRating != null ? userRating.rating : 0}" required />
                                            <span class="star" data-value="1">★</span>
                                            <span class="star" data-value="2">★</span>
                                            <span class="star" data-value="3">★</span>
                                            <span class="star" data-value="4">★</span>
                                            <span class="star" data-value="5">★</span>
                                        </div>
                                        <button type="submit" class="btn btn-primary px-4">
                                            <i class="fas fa-paper-plane me-2"></i>Gửi đánh giá
                                        </button>
                                    </div>
                                    <div th:if="${userRating != null}" class="mt-2 text-success fw-medium">
                                        <i class="fas fa-check-circle me-1"></i>Bạn đã đánh giá [[${userRating.rating}]] sao
                                    </div>
                                </form>
                            </div>

                            <!-- Comments Section -->
                            <div class="comments-section">
                                <h3 class="section-title">
                                    <i class="fas fa-comments"></i>Bình luận
                                </h3>
                                
                                <div class="comment-form">
                                    <img th:src="@{${user.imgurl}}" alt="Avatar" class="comment-avatar">
                                    <div class="comment-input">
                                        <form th:action="@{/quizzes/{id}/comments(id=${quiz.quizId})}" method="post">
                                            <textarea name="comment" class="form-control mb-2" rows="3" placeholder="Chia sẻ suy nghĩ của bạn về quiz này..." required></textarea>
                                            <button type="submit" class="btn btn-primary float-end">
                                                <i class="fas fa-paper-plane me-1"></i>Gửi bình luận
                                            </button>
                                        </form>
                                    </div>
                                </div>
                                
                                <div class="comment-list">
                                    <div th:each="comment : ${comments}" class="comment-item">
                                        <img th:src="@{${comment.user.imgurl}}" alt="Avatar" class="comment-avatar">
                                        <div class="comment-content">
                                            <div class="comment-author" th:text="${comment.user.username}">Tên người dùng</div>
                                            <div class="comment-text" th:text="${comment.comment}">Nội dung bình luận</div>
                                            <div class="comment-date" th:text="${#temporals.format(comment.createdAt, 'dd/MM/yyyy HH:mm')}">01/01/2023 12:00</div>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </section>
        </main>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function () {
            const stars = document.querySelectorAll('.star-rating .star');
            const ratingInput = document.getElementById('rating-value');
            
            // Initialize stars based on current rating
            const currentRating = ratingInput.value;
            if (currentRating > 0) {
                stars.forEach(star => {
                    star.classList.toggle('active', star.getAttribute('data-value') <= currentRating);
                });
            }
            
            // Handle star clicks
            stars.forEach(star => {
                star.addEventListener('click', function () {
                    const value = this.getAttribute('data-value');
                    ratingInput.value = value;
                    
                    stars.forEach(s => {
                        s.classList.toggle('active', s.getAttribute('data-value') <= value);
                    });
                });
                
                // Add hover effects
                star.addEventListener('mouseenter', function() {
                    const value = this.getAttribute('data-value');
                    stars.forEach(s => {
                        s.classList.toggle('hover', s.getAttribute('data-value') <= value);
                    });
                });
                
                star.addEventListener('mouseleave', function() {
                    stars.forEach(s => {
                        s.classList.remove('hover');
                    });
                });
            });
        });
    </script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
