<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Đăng ký</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
</head>
<body class="bg-light">

  <div class="container mt-5">
    <div class="mx-auto" style="max-width: 500px;">
      <div class="bg-white p-4 rounded-4 shadow-sm">
        <h3 class="text-center mb-4" style="color:#7c3aed;">Đăng ký</h3>

       <form th:action="@{/register}" th:object="${user}" method="post">
    <div th:if="${#fields.hasGlobalErrors()}" class="text-danger">
        <p th:each="err : ${#fields.globalErrors()}" th:text="${err}"></p>
    </div>

    <div class="mb-3">
        <label for="username" class="form-label">Tên người dùng</label>
        <input type="text" id="username" th:field="*{username}" class="form-control" required />
        <div th:if="${#fields.hasErrors('username')}" class="text-danger">
            <p th:each="err : ${#fields.errors('username')}" th:text="${err}"></p>
        </div>
    </div>

    <div class="mb-3">
        <label for="email" class="form-label">Email</label>
        <input type="email" id="email" th:field="*{email}" class="form-control" required />
        <div th:if="${#fields.hasErrors('email')}" class="text-danger">
            <p th:each="err : ${#fields.errors('email')}" th:text="${err}"></p>
        </div>
    </div>

    <div class="mb-3">
        <label for="password" class="form-label">Mật khẩu</label>
        <input type="password" id="password" th:field="*{password}" class="form-control" required />
        <div th:if="${#fields.hasErrors('password')}" class="text-danger">
            <p th:each="err : ${#fields.errors('password')}" th:text="${err}"></p>
        </div>
    </div>

    <div class="mb-3">
        <label for="confirmPassword" class="form-label">Xác nhận mật khẩu</label>
        <input type="password" id="confirmPassword" th:field="*{confirmPassword}" class="form-control" required />
        <div th:if="${#fields.hasErrors('confirmPassword')}" class="text-danger">
            <p th:each="err : ${#fields.errors('confirmPassword')}" th:text="${err}"></p>
        </div>
    </div>

    <button type="submit" class="btn btn-primary w-100" style="background-color:  #7c3aed;">Đăng ký</button>
</form>


        <div class="text-center my-3">
          <span>Hoặc đăng ký bằng</span>
        </div>

        <div class="d-grid gap-2 mb-3">
          <button class="btn btn-outline-secondary">
            <i class="bi bi-google me-2"></i> Google
          </button>
          <button class="btn btn-outline-secondary">
            <i class="bi bi-envelope me-2"></i> Gmail
          </button>
          <button class="btn btn-outline-secondary">
            <i class="bi bi-facebook me-2 text-primary"></i> Facebook
          </button>
        </div>

        <div class="text-center">
          <span>Đã có tài khoản?</span>
          <a href="login" class="text-decoration-none fw-bold ms-1" style="color:#7c3aed;">Đăng nhập</a>
        </div>
      </div>
    </div>
  </div>

</body>
</html>
