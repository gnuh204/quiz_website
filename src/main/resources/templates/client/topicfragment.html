<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Quizizz Student</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css" />

</head>

<body class="bg-white text-dark">
  <div class="d-flex min-vh-100">
    <!-- Sidebar -->
    <div th:replace="~{client/layout/sidebar :: sidebar}"></div>

    <!-- Main content -->
    <main class="flex-grow-1 d-flex flex-column">
      <!-- Top bar -->
      <div th:replace="~{client/layout/topbar :: topbar}"></div>
      <!-- Search-tab -->
      <div th:replace="~{client/layout/search-tab :: searchAndTab}"></div>
      <!-- Content grid -->
      <section class="flex-grow-1 overflow-auto p-4 bg-light">
        <div class="container">
          <h3 class="mb-4">Chủ đề nổi bật</h3>
          <div class="row row-cols-1 row-cols-md-4 g-3">
            <div class="col">
              <div class="card h-100">
                <img src="Anh/y-nghia-cac-con-so-cover.jpg" class="card-img-top" alt="Topic 1"
                  style="height:180px; object-fit:cover;">
                <div class="card-body">
                  <h5 class="card-title">Toán học</h5>
                  <p class="card-text">125 bài học</p>
                </div>
              </div>
            </div>
            <div class="col">
              <div class="card h-100">
                <img src="Anh/topic2.jpg" class="card-img-top" alt="Topic 2" style="height:180px; object-fit:cover;">
                <div class="card-body">
                  <h5 class="card-title">Khoa học</h5>
                  <p class="card-text">100 bài học</p>
                </div>
              </div>
            </div>
            <div class="col">
              <div class="card h-100">
                <img src="Anh/topic3.jpg" class="card-img-top" alt="Topic 3" style="height:180px; object-fit:cover;">
                <div class="card-body">
                  <h5 class="card-title">Lịch sử</h5>
                </div>
              </div>
            </div>
            <div class="col">
              <div class="card h-100">
                <img src="Anh/topic4.jpg" class="card-img-top" alt="Topic 4" style="height:180px; object-fit:cover;">
                <div class="card-body">
                  <h5 class="card-title">Văn học</h5>
                </div>
              </div>
            </div>
            <!-- Nếu muốn thêm thẻ thứ 5, nó sẽ xuống hàng tiếp theo -->
            <div class="col">
              <div class="card h-100">
                <img src="Anh/topic5.jpg" class="card-img-top" alt="Topic 5" style="height:180px; object-fit:cover;">
                <div class="card-body">
                  <h5 class="card-title">Địa lý</h5>
                </div>
              </div>
            </div>
          </div>
        </div>
      </section>
    </main>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
