<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Quizizz Student</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css" rel="stylesheet"/>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"/>

</head>
<body class="bg-white text-dark">
  <div class="d-flex min-vh-100">
    <!-- Sidebar -->
     <div th:replace="client/layout/sidebar :: sidebar"></div>
    <!-- Main content -->
    <main class="flex-grow-1 d-flex flex-column">
      <!-- Top bar -->
      <div th:replace="client/layout/topbar :: topbar"></div>  
      <!-- Search-tab -->
      <div th:replace="client/layout/search-tab :: searchAndTab"></div>
      <!-- Content grid -->
      <section class="flex-grow-1 overflow-auto p-4 bg-light">
        <div class="row row-cols-1 row-cols-md-5 g-3">
          <!-- Card 1 -->
          <div class="col">
            <div class="card h-100 text-white border-0" style="background-image: url('images/card1.jpg'); background-size: cover; background-position: center;">
              <div class="card-body d-flex flex-column justify-content-end" style="background: rgba(0,0,0,0.35); min-height: 320px;">
                <div class="mb-2 small"></div>
                <h5 class="card-title mb-1">CHỦ ĐỀ 1</h5>
              </div>
            </div>
            <div class="bg-dark text-white text-center py-2 rounded-bottom">
              <span class="me-2">
                <i class="bi bi-book" style="font-size: 1.5rem;"></i>
              </span>
              Số lượng bài <span class="ms-2 text-warning">30</span>
            </div>
          </div>

          </div>

      </section>
    </main>
  </div>

</html>
