<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Quên mật khẩu</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet" />
</head>
<body class="bg-light">

  <div class="container mt-5">
    <div class="mx-auto" style="max-width: 500px;">
      <div class="bg-white p-4 rounded-4 shadow-sm">
        <h3 class="text-center mb-4 text-primary fw-bold">Quên mật khẩu</h3>

        <form>
          <div class="mb-3">
            <label for="username" class="form-label">Tên đăng nhập</label>
            <input type="text" id="username" class="form-control" required />
          </div>

          <div class="mb-3">
            <label for="email" class="form-label">Email khôi phục</label>
            <input type="email" id="email" class="form-control" required />
          </div>

          <button type="submit" class="btn btn-primary w-100">Gửi yêu cầu đặt lại mật khẩu</button>
        </form>

        <div class="text-center mt-3">
          <a href="login" class="text-decoration-none text-primary fw-bold">
            <i class="bi bi-arrow-left"></i> Quay lại đăng nhập
          </a>
        </div>
      </div>
    </div>
  </div>

</body>
</html>
