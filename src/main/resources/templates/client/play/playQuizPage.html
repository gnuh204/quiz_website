<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <title>Quiz Game</title>
    <link rel="stylesheet" th:href="@{/css/style.css}" />
    <style>
        body {
            background: linear-gradient(to bottom, #4b0082, #800080);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: white;
            margin: 0;
            padding: 0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
        }

        .top-bar {
            width: 100%;
            max-width: 900px;
            padding: 20px;
            display: flex;
            justify-content: space-between;
            font-size: 18px;
            font-weight: bold;
        }

        .question-container {
            background-color: rgba(255, 255, 255, 0.12);
            padding: 30px 40px;
            border-radius: 20px;
            max-width: 900px;
            width: 100%;
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.4);
            margin-bottom: 40px;
        }

        .question {
            font-size: 28px;
            font-weight: bold;
            margin-bottom: 25px;
        }

        .question-image {
            max-width: 100%;
            height: auto;
            border-radius: 16px;
            margin-bottom: 30px;
            box-shadow: 0 6px 16px rgba(0, 0, 0, 0.5);
        }

        .answers {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
        }

        .answers button {
            background-color: rgba(255, 255, 255, 0.15);
            color: white;
            padding: 15px;
            border: none;
            border-radius: 12px;
            font-size: 18px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
        }

        .answers button:hover {
            background-color: rgba(255, 255, 255, 0.25);
            transform: scale(1.05);
        }

        @media (max-width: 600px) {
            .top-bar {
                flex-direction: column;
                align-items: center;
                gap: 10px;
            }
        }
    </style>
</head>
<body>

    <!-- Top bar -->
    <div class="top-bar">
        <div class="bonus">Bonus</div>
        <div class="score" th:text="'Score: ' + ${score}">Score: 0</div>
    </div>

    <!-- Question Content -->
    <div class="question-container">
        <div class="question" th:text="${question.questionText}">
            What kind of birds are the main characters?
        </div>

        <img class="question-image" th:src="@{${question.imageUrl}}" alt="Question Image" />

   <form method="post"
      th:action="@{'/quizzes/take/' + ${quiz.quizId} + '/question/' + ${currentIndex} + '/answer'}">
    <!-- CSRF token nếu dùng Spring Security -->
    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />

    <input type="hidden" name="index" th:value="${currentIndex}" />
    <input type="hidden" name="score" th:value="${score}" />

    <div class="answers">
        <div th:each="choice : ${question.choices}">
            <button type="submit"
                    name="isCorrect"
                    th:value="${choice.isCorrect}"
                    th:text="${choice.choiceText}">
            </button>
        </div>
    </div>
</form>
    </div>

</body>
</html>
