<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Quizizz Student</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css" />
</head>
<body class="bg-white text-dark">
    <div class="d-flex min-vh-100">
        <!-- Sidebar -->
        <div th:replace="~{client/layout/sidebar :: sidebar}"></div>
        <!-- Main content -->
        <main class="flex-grow-1 d-flex flex-column ">
            <!-- Top bar -->
            <div th:replace="~{client/layout/topbar :: topbar}"></div>
            <!-- Content grid -->
            <div class="container center">
                <section class="flex-grow-1 overflow-auto p-4">
                    <main class="container my-5">
                        <section class="bg-white rounded-3 p-4 shadow-sm mx-auto" style="max-width: 950px;">
                            <div class="d-flex justify-content-between align-items-start mb-4">
                                <div>
                                    <h2 class="fw-bold fs-4">Tên Quiz</h2>
                                    <p class="mb-1 text-muted">Mô tả: <span class="text-dark">Đây là mô tả</span></p>
                                    <p class="mb-0 text-muted">Thời gian: <span class="text-dark">... phút</span></p>
                                </div>
                                <button class="btn" style="background-color: purple; color: white;"
                                    onclick="window.location.href='CreateQuiz'">
                                    Thêm câu hỏi
                                </button>
                            </div>

                            <div class="accordion" id="questionAccordion">
                                <div class="accordion-item">
                                    <h2 class="accordion-header" id="headingList">
                                        <button class="accordion-button collapsed" type="button"
                                            data-bs-toggle="collapse" data-bs-target="#collapseList"
                                            aria-expanded="false" aria-controls="collapseList">
                                            Danh sách câu hỏi
                                        </button>
                                    </h2>
                                    <div id="collapseList" class="accordion-collapse collapse show"
                                        aria-labelledby="headingList" data-bs-parent="#questionAccordion">
                                        <div class="accordion-body">
                                            <div class="alert alert-danger text-center mb-0">
                                                <strong>Danh sách câu hỏi đang trống.</strong><br>
                                                Nhấn nút để thêm câu hỏi.
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </section>
                    </main>
                </section>
            </div>
        </main>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
