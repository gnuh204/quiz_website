<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Quizizz Student</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css" />
</head>

<body class="bg-white text-dark">
    <div class="d-flex min-vh-100">
        <!-- Sidebar would be inserted here by Thymeleaf -->
        <div th:replace="~{client/layout/sidebar :: sidebar}"></div>

        <!-- Main content -->
        <main class="flex-grow-1 d-flex flex-column">
            <!-- Top bar would be inserted here by Thymeleaf -->
            <div th:replace="~{client/layout/topbar :: topbar}"></div>

            <!-- Content grid -->
            <section class="flex-grow-1 overflow-auto p-4 bg-light">
                <div class="container d-flex justify-content-center align-items-start">
                    <div class="bg-white rounded-3 shadow-sm p-4"
                        style="max-width: 600px; width: 100%; margin-top: 24px;">
                        <h2 class="fw-bold mb-4" style="font-size: 2rem;">Chỉnh sửa hồ sơ cá nhân</h2>
                        <form method="post" action="/user/update" enctype="multipart/form-data">
                            <div class="row">
                                <div class="col-md-8">
                                    <!-- Personal information -->
                                    <div class="mb-3">
                                        <label for="username" class="form-label mb-1">Tên tài khoản</label>
                                        <input type="text" class="form-control" id="username" name="username"
                                            placeholder="Nhập tên tài khoản" th:value="${user.username}">
                                    </div>
                                    <div class="mb-3">
                                        <label for="email" class="form-label mb-1">E-mail</label>
                                        <input type="email" class="form-control" id="email" name="email"
                                            placeholder="Nhập email" th:value="${user.email}">
                                    </div>
                                    <div class="mb-3">
                                        <label for="position" class="form-label mb-1">Chức vụ</label>
                                        <input type="text" class="form-control" id="position" name="position"
                                            placeholder="Nhập chức vụ" value="Học sinh" readonly>
                                    </div>
                                </div>
                                <div class="col-md-4 d-flex flex-column align-items-center justify-content-start">
                                    <!-- Avatar image and file selector -->
                                    <label for="avatar" class="form-label mb-2">Ảnh đại diện</label>
                                    <img th:src="${user?.imgurl != null and not #strings.isEmpty(user.imgurl)} ? @{${user.imgurl}} : @{/images/default-avatar.png}"
                                        alt="avatar" class="rounded-circle mb-2" width="120" height="120"
                                        style="object-fit:cover;" id="avatarPreview">

                                    <input type="file" class="form-control" id="avatar" name="avatar"
                                        style="max-width: 180px;" accept="image/*">
                                </div>
                            </div>
                            <button type="submit" class="btn w-100 fw-semibold text-white mt-3"
                                style="background:#8d5fd3;">Lưu thay đổi</button>
                            <hr>
                        </form>
                    </div>
                </div>
            </section>
        </main>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // Preview avatar image when selected
        const avatarInput = document.getElementById('avatar');
        const avatarPreview = document.getElementById('avatarPreview');

        avatarInput.addEventListener('change', function (event) {
            const [file] = avatarInput.files;
            if (file) {
                avatarPreview.src = URL.createObjectURL(file);
            } else {
                // Reset to default if no file selected
                avatarPreview.src = avatarPreview.getAttribute('data-default-src');
            }
        });

        // Store default src on page load
        window.onload = function () {
            avatarPreview.setAttribute('data-default-src', avatarPreview.src);
        }
    </script>
</body>

</html>
