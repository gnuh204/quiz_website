<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Quizizz Student</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css" />

</head>

<body class="bg-white text-dark">
    <div class="d-flex min-vh-100">
        <!-- Sidebar -->
        <div th:replace="~{client/layout/sidebar :: sidebar}"></div>

        <!-- Main content -->
        <main class="flex-grow-1 d-flex flex-column">
            <!-- Top bar -->
            <div th:replace="~{client/layout/topbar :: topbar}"></div>
            <!-- Content grid -->
            <section class="flex-grow-1 overflow-auto p-4 bg-light">
                <div class="container-fluid">
                    <div th:replace="~{client/layout/filter-tab :: filterTab}"></div>
                </div>
                <div class="row justify-content-center">
                    <div class="bg-white rounded-3 shadow-sm p-5 text-center">
                        <!-- Danh sách dữ liệu báo cáo -->
                        <div class="mb-4">
                            <div class="border rounded-3 p-3 bg-light">
                                <div class="d-flex align-items-center gap-3">
                                    <img src="Anh/7a14e25c1c033ea1b7182eea6d54d87e.jpg" alt="Ảnh bài học"
                                        class="rounded-3" style="width: 150px; height: 150px; object-fit: cover;">
                                    <div class="d-flex flex-column align-items-start gap-2">
                                        <div class="fw-semibold"><span class="text-primary">Giải phương trình bậc
                                                hai</span>
                                        </div>
                                        <div>Chủ đề: <span class="fw-semibold">Toán học</span></div>
                                        <div>Tác giả: <span class="fw-semibold">Đức Khánh</span></div>
                                    </div>
                                </div>
                                <div class="mt-3 border rounded-3 p-3 bg-white d-flex align-items-start gap-3">
                                    <img src="Anh/7a14e25c1c033ea1b7182eea6d54d87e.jpg" alt="Avatar"
                                        class="rounded-circle"
                                        style="width:40px; height:40px; object-fit:cover; flex-shrink:0;">
                                    <div class="flex-grow-1 d-flex flex-column">
                                        <span class="fw-semibold" style="word-break: break-word;"></span>
                                    </div>
                                </div>
                            </div>
                        </div>
                        <hr>
                        <div class="fw-semibold fs-5 mb-2">Đó là tất cả các đánh giá của bạn!</div>
                    </div>
                </div>
    </div>
    </section>
    </main>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
