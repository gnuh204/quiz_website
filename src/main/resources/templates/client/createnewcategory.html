<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Tạo chủ đề mới</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css" />
    <style>
        :root {
            --primary-color: #7c3aed;
            --primary-light: #9f7aea;
            --primary-dark: #5b21b6;
            --secondary-color: #f5f3ff;
            --text-dark: #1e293b;
            --text-light: #64748b;
            --border-radius: 12px;
            --box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
        }
        
        body {
            font-family: 'Inter', sans-serif;
            color: var(--text-dark);
            background-color: #f8fafc;
        }
        
        .form-control, .form-select {
            padding: 0.75rem 1rem;
            border-radius: var(--border-radius);
            border: 1px solid #e2e8f0;
            transition: all 0.3s ease;
        }
        
        .form-control:focus, .form-select:focus {
            border-color: var(--primary-light);
            box-shadow: 0 0 0 3px rgba(124, 58, 237, 0.2);
        }
        
        .btn-primary {
            background-color: var(--primary-color);
            border: none;
            padding: 0.75rem 1.5rem;
            border-radius: var(--border-radius);
            font-weight: 500;
            transition: all 0.3s ease;
        }
        
        .btn-primary:hover {
            background-color: var(--primary-dark);
            transform: translateY(-2px);
        }
        
        .btn-outline-primary {
            color: var(--primary-color);
            border-color: var(--primary-color);
            border-radius: var(--border-radius);
        }
        
        .btn-outline-primary:hover {
            background-color: var(--primary-color);
        }
        
        .card {
            border-radius: var(--border-radius);
            border: none;
            box-shadow: var(--box-shadow);
            transition: transform 0.3s ease;
        }
        
        .card:hover {
            transform: translateY(-5px);
        }
        
        .section-title {
            font-weight: 600;
            color: var(--text-dark);
            position: relative;
            padding-bottom: 0.75rem;
        }
        
        .section-title::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            width: 50px;
            height: 4px;
            background-color: var(--primary-color);
            border-radius: 2px;
        }
        
        .image-upload-container {
            border: 2px dashed #cbd5e1;
            border-radius: var(--border-radius);
            background-color: #f8fafc;
            transition: all 0.3s ease;
            cursor: pointer;
        }
        
        .image-upload-container:hover {
            border-color: var(--primary-light);
            background-color: var(--secondary-color);
        }
        
        .image-preview {
            border-radius: var(--border-radius);
            overflow: hidden;
            box-shadow: var(--box-shadow);
            transition: all 0.3s ease;
        }
        
        .image-preview:hover {
            transform: scale(1.02);
        }
    </style>
</head>

<body class="bg-light">
    <div class="d-flex min-vh-100">
        <!-- Sidebar -->
        <div th:replace="~{client/layout/sidebar :: sidebar}"></div>
        
        <!-- Main content -->
        <main class="flex-grow-1 d-flex flex-column">
            <!-- Top bar -->
            <div th:replace="~{client/layout/topbar :: topbar}"></div>

            <!-- Content grid -->
            <div class="container-fluid py-4">
                <div class="row justify-content-center">
                    <div class="col-lg-8">
                        <div class="card animate__animated animate__fadeIn">
                            <div class="card-body p-5">
                                <div class="d-flex justify-content-between align-items-center mb-4">
                                    <h2 class="section-title mb-0">Tạo chủ đề mới</h2>
                                    <a href="/NewCategory" class="btn btn-outline-secondary">
                                        <i class="bi bi-arrow-left me-2"></i>Quay lại
                                    </a>
                                </div>
                                
                                <form th:action="@{/topics/save}" method="post" enctype="multipart/form-data">
                                    <div class="row g-4">
                                        <div class="col-md-8">
                                            <div class="mb-4">
                                                <label for="quizTitle" class="form-label fw-medium">Tên chủ đề</label>
                                                <input type="text" class="form-control form-control-lg" id="quizTitle" name="title"
                                                    placeholder="Nhập tên chủ đề..." required />
                                                <div class="form-text">Tên chủ đề nên ngắn gọn và mô tả rõ nội dung.</div>
                                            </div>
                                            
                                            <div class="mb-4">
                                                <label class="form-label fw-medium">Ảnh chủ đề</label>
                                                <div class="image-upload-container p-5 text-center" onclick="document.getElementById('quizImage').click()">
                                                    <i class="bi bi-image fs-1 text-muted mb-3"></i>
                                                    <h5 class="mb-2">Kéo thả ảnh vào đây hoặc click để chọn</h5>
                                                    <p class="text-muted mb-0">Định dạng hỗ trợ: JPG, PNG, GIF</p>
                                                    <p class="text-muted">Kích thước tối đa: 5MB</p>
                                                    <input type="file" class="form-control d-none" id="quizImage" name="imageFile"
                                                        accept="image/*" />
                                                </div>
                                            </div>
                                        </div>
                                        
                                        <div class="col-md-4">
                                            <div class="sticky-top" style="top: 20px;">
                                                <div class="card bg-light border-0">
                                                    <div class="card-body text-center">
                                                        <h6 class="fw-medium mb-3">Xem trước ảnh</h6>
                                                        <div class="image-preview mx-auto mb-3" 
                                                            style="width: 200px; height: 200px; background-color: #f1f5f9;">
                                                            <img id="imagePreview" class="img-fluid w-100 h-100"
                                                                style="object-fit: cover; display: none;" />
                                                            <div id="placeholderIcon" class="d-flex flex-column justify-content-center align-items-center h-100 text-muted">
                                                                <i class="bi bi-image fs-1"></i>
                                                                <small>Ảnh sẽ hiển thị ở đây</small>
                                                            </div>
                                                        </div>
                                                        <button type="button" id="removeImageBtn" class="btn btn-sm btn-outline-danger d-none">
                                                            <i class="bi bi-trash me-1"></i> Xóa ảnh
                                                        </button>
                                                    </div>
                                                </div>
                                                
                                                <div class="d-grid gap-2 mt-4">
                                                    <button type="submit" class="btn btn-primary btn-lg">
                                                        <i class="bi bi-save me-2"></i>Lưu chủ đề
                                                    </button>
                                                    <button type="button" class="btn btn-outline-secondary">
                                                        <i class="bi bi-x-circle me-2"></i>Hủy bỏ
                                                    </button>
                                                </div>
                                            </div>
                                        </div>
                                    </div>
                                </form>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        const quizImage = document.getElementById('quizImage');
        const imagePreview = document.getElementById('imagePreview');
        const placeholderIcon = document.getElementById('placeholderIcon');
        const removeImageBtn = document.getElementById('removeImageBtn');

        quizImage.addEventListener('change', function (event) {
            const file = event.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function (e) {
                    imagePreview.src = e.target.result;
                    imagePreview.style.display = 'block';
                    placeholderIcon.style.display = 'none';
                    removeImageBtn.classList.remove('d-none');
                };
                reader.readAsDataURL(file);
            }
        });

        removeImageBtn.addEventListener('click', function() {
            quizImage.value = '';
            imagePreview.style.display = 'none';
            placeholderIcon.style.display = 'flex';
            removeImageBtn.classList.add('d-none');
        });
    </script>
</body>
</html>
