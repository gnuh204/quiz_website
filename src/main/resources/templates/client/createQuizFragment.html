<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Tạo một Quiz mới</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <style>
        :root {
            --primary-color: #7c3aed;
            --primary-light: #9f7aea;
            --primary-dark: #5b21b6;
            --secondary-color: #f5f3ff;
            --text-dark: #1e293b;
            --text-light: #64748b;
            --border-radius: 8px;
            --box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
        }
        
        body {
            font-family: 'Inter', sans-serif;
            color: var(--text-dark);
            background-color: #f8fafc;
        }
        
        .form-control, .form-select {
            padding: 0.75rem 1rem;
            border-radius: var(--border-radius);
            border: 1px solid #e2e8f0;
            transition: all 0.2s ease;
        }
        
        .form-control:focus, .form-select:focus {
            border-color: var(--primary-light);
            box-shadow: 0 0 0 3px rgba(124, 58, 237, 0.1);
        }
        
        .btn-primary {
            background-color: var(--primary-color);
            border: none;
            padding: 0.75rem 1.5rem;
            border-radius: var(--border-radius);
            font-weight: 500;
            transition: all 0.2s ease;
        }
        
        .btn-primary:hover {
            background-color: var(--primary-dark);
            transform: translateY(-1px);
        }
        
        .quiz-card {
            border-radius: var(--border-radius);
            border: none;
            box-shadow: var(--box-shadow);
            transition: transform 0.2s ease;
        }
        
        .quiz-card:hover {
            transform: translateY(-2px);
        }
        
        .section-title {
            font-weight: 600;
            color: var(--text-dark);
            position: relative;
            padding-bottom: 0.75rem;
        }
        
        .section-title::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            width: 50px;
            height: 3px;
            background-color: var(--primary-color);
            border-radius: 2px;
        }
        
        .image-upload-container {
            border: 2px dashed #cbd5e1;
            border-radius: var(--border-radius);
            background-color: #f8fafc;
            transition: all 0.2s ease;
            cursor: pointer;
        }
        
        .image-upload-container:hover {
            border-color: var(--primary-light);
            background-color: var(--secondary-color);
        }
        
        .image-preview {
            border-radius: var(--border-radius);
            overflow: hidden;
            box-shadow: var(--box-shadow);
        }
        
        .time-input-container {
            position: relative;
            max-width: 200px;
        }
        
        .time-input-container::after {
            content: 'phút';
            position: absolute;
            right: 15px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-light);
            font-size: 0.875rem;
        }
    </style>
</head>

<body>
    <div class="d-flex min-vh-100">
        <!-- Sidebar -->
        <div th:replace="~{client/layout/sidebar :: sidebar}"></div>
        
        <!-- Main content -->
        <main class="flex-grow-1 d-flex flex-column">
            <!-- Top bar -->
            <div th:replace="~{client/layout/topbar :: topbar}"></div>

            <!-- Content grid -->
            <section class="flex-grow-1 overflow-auto p-4 bg-light">
                <div class="container my-4">
                    <div class="row justify-content-center">
                        <div class="col-lg-8">
                            <div class="quiz-card bg-white p-4">
                                <div class="d-flex justify-content-between align-items-center mb-4">
                                    <h2 class="section-title mb-0">Tạo quiz mới</h2>
                                    <a href="#" class="btn btn-outline-secondary btn-sm">
                                        <i class="bi bi-arrow-left me-1"></i> Quay lại
                                    </a>
                                </div>

                                <form id="quizForm" th:action="@{/quizzes/save}" method="post" enctype="multipart/form-data">
                                    <div class="mb-4">
                                        <label for="quizMainContent" class="form-label fw-medium">Tên quiz</label>
                                        <input type="text" class="form-control" id="quizMainContent" name="title"
                                            placeholder="Nhập tên quiz" required />
                                    </div>

                                    <div class="mb-4">
                                        <label for="quizDescription" class="form-label fw-medium">Mô tả quiz</label>
                                        <textarea class="form-control" id="quizDescription" name="description" rows="3"
                                            placeholder="Nhập mô tả quiz..." required></textarea>
                                    </div>

                                    <div class="row g-4 mb-4">
                                        <div class="col-md-8">
                                            <div class="mb-4">
                                                <label for="quizCategory" class="form-label fw-medium">Chủ đề</label>
                                                <select class="form-select" id="quizCategory" name="categoryId" required>
                                                    <option selected disabled hidden value="">-- Chọn chủ đề --</option>
                                                    <option th:each="category : ${categories}" th:value="${category.categoryId}"
                                                        th:text="${category.name}">
                                                    </option>
                                                </select>
                                            </div>

                                            <div class="mb-4">
                                                <label class="form-label fw-medium">Ảnh minh họa (tùy chọn)</label>
                                                <div class="image-upload-container p-4 text-center" 
                                                    onclick="document.getElementById('quizImage').click()">
                                                    <i class="bi bi-image fs-1 text-muted mb-2"></i>
                                                    <h6 class="mb-1">Kéo thả ảnh vào đây hoặc click để chọn</h6>
                                                    <p class="text-muted small mb-0">Định dạng: JPG, PNG, GIF (tối đa 5MB)</p>
                                                    <input type="file" class="form-control d-none" id="quizImage" name="imageFile" accept="image/*" />
                                                </div>
                                            </div>
                                        </div>

                                        <div class="col-md-4">
                                            <div class="sticky-top" style="top: 20px;">
                                                <div class="bg-light p-3 rounded-3">
                                                    <h6 class="fw-medium mb-3 text-center">Xem trước ảnh</h6>
                                                    <div class="image-preview mx-auto mb-3" 
                                                        style="width: 100%; height: 180px; background-color: #f1f5f9;">
                                                        <img id="imagePreview" class="img-fluid w-100 h-100"
                                                            style="object-fit: cover; display: none;" />
                                                        <div id="placeholderIcon" class="d-flex flex-column justify-content-center align-items-center h-100 text-muted">
                                                            <i class="bi bi-image fs-1"></i>
                                                            <small class="text-center">Ảnh sẽ hiển thị ở đây</small>
                                                        </div>
                                                    </div>
                                                    <button type="button" id="removeImageBtn" class="btn btn-sm btn-outline-danger w-100 d-none">
                                                        <i class="bi bi-trash me-1"></i> Xóa ảnh
                                                    </button>
                                                </div>
                                            </div>
                                        </div>
                                    </div>

                                    <div class="mb-4">
                                        <label for="quizTimeLimit" class="form-label fw-medium">Giới hạn thời gian</label>
                                        <div class="time-input-container">
                                            <input type="number" class="form-control pe-5" id="quizTimeLimit" name="timeLimitMinutes"
                                                placeholder="0" min="1" required />
                                        </div>
                                        <div class="form-text">Thời gian tối thiểu: 1 phút</div>
                                    </div>

                                    <div class="d-grid gap-2">
                                        <button type="submit" class="btn btn-primary">
                                            <i class="bi bi-save me-2"></i> Lưu quiz
                                        </button>
                                    </div>
                                </form>
                            </div>
                        </div>
                    </div>
                </div>

                <script>
                    const quizImage = document.getElementById('quizImage');
                    const imagePreview = document.getElementById('imagePreview');
                    const placeholderIcon = document.getElementById('placeholderIcon');
                    const removeImageBtn = document.getElementById('removeImageBtn');

                    // Handle image upload preview
                    quizImage.addEventListener('change', function (event) {
                        const file = event.target.files[0];
                        if (file) {
                            const reader = new FileReader();
                            reader.onload = function (e) {
                                imagePreview.src = e.target.result;
                                imagePreview.style.display = 'block';
                                placeholderIcon.style.display = 'none';
                                removeImageBtn.classList.remove('d-none');
                            };
                            reader.readAsDataURL(file);
                        }
                    });

                    // Handle remove image button
                    removeImageBtn.addEventListener('click', function() {
                        quizImage.value = '';
                        imagePreview.style.display = 'none';
                        placeholderIcon.style.display = 'flex';
                        removeImageBtn.classList.add('d-none');
                    });
                </script>
            </section>
        </main>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
