<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Quizizz Student</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css" />
</head>

<body class="bg-white text-dark">
    <div class="d-flex min-vh-100">
        <!-- Sidebar -->
        <div th:replace="~{client/layout/sidebar :: sidebar}"></div>
        <!-- Main content -->
        <main class="flex-grow-1 d-flex flex-column ">
            <!-- Top bar -->
            <div th:replace="~{client/layout/topbar :: topbar}"></div>

            <!-- Content grid -->
               <section class="flex-grow-1 overflow-auto p-4 bg-light">
                <div class="container-fluid">
                    <div class="row justify-content-center">
                        <div class="col-12 col-md-10 col-lg-8">
                            <div class="bg-white rounded-3 shadow-sm p-5">
                                <!-- Thông tin bài quiz -->
                                <div class="mb-4 text-center">
                                    <div class="rounded-3 p-3">
                                        <div class="d-flex align-items-center gap-3">
                                            <img src="Anh/7a14e25c1c033ea1b7182eea6d54d87e.jpg" alt="Ảnh bài học"
                                                class="rounded-circle"
                                                style="width: 150px; height: 150px; object-fit: cover;">
                                            <div class="d-flex flex-column align-items-start gap-2">
                                                <div class="fw-semibold" style="font-size: 200%; color: #7c3aed;">
                                                    <span>Giải phương trình bậc hai</span>
                                                </div>
                                                <div>Chủ đề: <span class="fw-semibold">Toán học</span></div>
                                                <div>Tác giả: <span class="fw-semibold">Đức Khánh</span></div>
                                                <div>Ngày tạo: <span class="fw-semibold">01/01/2023</span></div>
                                                <div>Số lượng câu hỏi: <span class="fw-semibold text-success">15</span>
                                                </div>
                                                <div>Thời gian làm bài (Phút): <span
                                                        class="fw-semibold text-success">10</span></div>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                                <hr>
                                <!-- Question 1 -->
                                <div class="quiz-question" style="border-bottom:1px solid #e5e7eb;padding:1.5rem 0;">
                                    <div class="d-flex justify-content-between align-items-center mb-1">
                                        <span class="text-uppercase text-secondary fw-semibold"
                                            style="font-size: 0.95rem;">1. Nhiều lựa chọn</span>
                                        <div>
                                            <button class="btn btn-outline-primary btn-sm me-2" type="button">
                                                <i class="fas fa-edit"></i> Sửa
                                            </button>
                                            <button class="btn btn-outline-danger btn-sm" type="button">
                                                <i class="fas fa-trash-alt"></i> Xoá
                                            </button>
                                        </div>
                                    </div>
                                    <div class="fw-semibold mb-2" style="font-size: 1.1rem;">What kind of birds are the
                                        main characters?</div>
                                    <div class="row mb-2">
                                        <div class="col-12 col-md-6">
                                            <div class="form-check mb-2">
                                                <input class="form-check-input" type="radio" name="q1" id="q1a1">
                                                <label class="form-check-label" for="q1a1">Swans</label>
                                            </div>
                                            <div class="form-check mb-2">
                                                <input class="form-check-input" type="radio" name="q1" id="q1a2"
                                                    checked>
                                                <label class="form-check-label" for="q1a2">Ducks</label>
                                            </div>
                                        </div>
                                        <div class="col-12 col-md-6">
                                            <div class="form-check mb-2">
                                                <input class="form-check-input" type="radio" name="q1" id="q1a3">
                                                <label class="form-check-label" for="q1a3">Peacocks</label>
                                            </div>
                                            <div class="form-check mb-2">
                                                <input class="form-check-input" type="radio" name="q1" id="q1a4">
                                                <label class="form-check-label" for="q1a4">Parrots</label>
                                            </div>
                                        </div>
                                    </div>
                                    <div class="d-flex align-items-center gap-2">
                                        <div>Đáp án đúng: <span class="fw-semibold text-success"></span>
                                        </div>
                                    </div>
                                </div>
                                <!-- Nút tạo thêm câu hỏi -->
                                <div class="text-center mt-4">
                                    <button class="btn btn-success btn-lg px-5" type="button">
                                        <i class="fas fa-plus"></i> Thêm câu hỏi
                                    </button>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

            </section>
            

        </main>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
