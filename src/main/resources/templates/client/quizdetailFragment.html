<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Quizizz Student</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet" />
    <link rel="stylesheet" th:href="@{/styles.css}" />

</head>

<body class="bg-white text-dark">
    <div class="d-flex min-vh-100">
        <!-- Sidebar -->
        <div th:replace="~{client/layout/sidebar :: sidebar}"></div>
        <!-- Main content -->
        <main class="flex-grow-1 d-flex flex-column ">
            <!-- Top bar -->
            <div th:replace="~{client/layout/topbar :: topbar}"></div>
            <!-- Content grid -->
            <section class="flex-grow-1 overflow-auto p-4 bg-light">
                <div class="container-fluid">
                    <div class="row justify-content-center">
                        <div class="col-12 col-md-10 col-lg-8">
                            <div class="bg-white rounded-3 shadow-sm p-5">
                                <!-- Thông tin bài quiz -->
                                <!-- Thông tin bài quiz -->
                                <div class="mb-4 text-center">
                                    <div class="rounded-3 p-3">
                                        <div class="d-flex align-items-center gap-3">
                                            <!-- Ảnh quiz -->
                                            <img th:src="${#strings.isEmpty(quiz.imageUrl) ? '/images/default-quiz.png' : quiz.imageUrl}"
                                                
                                                style="width: 150px; height: 150px; object-fit: cover;" />


                                            <div class="d-flex flex-column align-items-start gap-2">
                                                <div class="fw-semibold" style="font-size: 200%; color: #7c3aed;">
                                                    <span th:text="${quiz.title}">Giải phương trình bậc hai</span>

                                                </div>
                                                <div>Chủ đề: <span class="fw-semibold"
                                                        th:text="${quiz.category?.name}">Toán học</span></div>
                                                <div>Tác giả: <span class="fw-semibold"
                                                        th:text="${quiz.createdBy.username}">Đức Khánh</span></div>
                                                <div>Ngày tạo: <span class="fw-semibold"
                                                        th:text="${#temporals.format(quiz.createdAt, 'dd/MM/yyyy')}">01/01/2023</span>
                                                </div>
                                                <div>Số lượng câu hỏi: <span class="fw-semibold text-success"
                                                        th:text="${questions.size()}">15</span></div>
                                                <div>Thời gian làm bài (Phút): <span class="fw-semibold text-success"
                                                        th:text="${quiz.timeLimitMinutes}">10</span></div>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                                <hr>

                                <!-- Danh sách câu hỏi -->
                                <div th:each="question, iter : ${questions}" class="quiz-question"
                                    style="border-bottom:1px solid #e5e7eb;padding:1.5rem 0;">
                                    <div class="d-flex justify-content-between align-items-center mb-1">
                                        <span class="text-uppercase text-secondary fw-semibold"
                                            style="font-size: 0.95rem;">
                                            <span th:text="${iter.index + 1}">1</span>
                                            <div>
                                                <a th:href="@{/questions/edit/{id}(id=${question.questionId})}"
                                                    class="btn btn-outline-primary btn-sm me-2">
                                                    <i class="fas fa-edit"></i> Sửa
                                                </a>
                                                <a th:href="@{/questions/delete/{id}(id=${question.questionId})}"
                                                    class="btn btn-outline-danger btn-sm">
                                                    <i class="fas fa-trash-alt"></i> Xoá
                                                </a>
                                            </div>
                                    </div>

                                    <!-- Nội dung câu hỏi -->
                                    <div class="fw-semibold mb-2" style="font-size: 1.1rem;"
                                        th:text="${question.questionText}">What kind of birds are the main characters?
                                    </div>

                                    <!-- Ảnh câu hỏi (nếu có) -->
                                    <img th:if="${not #strings.isEmpty(question.imageUrl)}"
                                        th:src="${question.imageUrl}" class="img-fluid mb-3" style="max-height: 200px;">

                                    <!-- Các lựa chọn -->
                                    <div class="row mb-2">
                                        <div th:each="choice, choiceIter : ${question.choices}"
                                            th:class="${choiceIter.index < 2 ? 'col-12 col-md-6' : 'col-12 col-md-6'}">
                                            <div class="form-check mb-2">
                                                <input class="form-check-input"
                                                    th:type="${question.questionType == T(com.example.qiuzweb.domain.Question.QuestionType).SINGLE ? 'radio' : 'checkbox'}"
                                                    th:name="'choices[' + ${choiceIter.index} + '].isCorrect'"
                                                    th:id="'q' + ${choiceIter.index}">
                                                <label class="form-check-label" th:for="'q' + ${choiceIter.index}"
                                                    th:text="${choice.choiceText}">Đáp án</label>
                                            </div>
                                        </div>
                                    </div>

                                    <!-- Đáp án đúng -->
                                    <div class="d-flex align-items-center gap-2">
                                        <div>Đáp án đúng:
                                            <span class="fw-semibold text-success">
                                                <span th:each="choice, choiceIter : ${question.choices}"
                                                    th:if="${choice.isCorrect}"
                                                    th:text="${choice.choiceText} + (${choiceIter.last} ? '' : ' ')">Đáp
                                                    án</span>
                                            </span>
                                        </div>

                                    </div>

                                </div>
                                <!-- Nút tạo thêm câu hỏi -->
                                <div class="text-center mt-4">
                                    <a th:href="@{/questions/add/{quizId}(quizId=${quiz.quizId})}"
                                        class="btn btn-primary" style="width: 200px;">
                                        <i class="fas fa-plus"></i> Thêm câu hỏi
                                    </a>

                                </div>
                            </div>
                        </div>
                    </div>
                </div>

            </section>


        </main>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
