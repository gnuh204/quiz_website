<!DOCTYPE html>
<html lang="vi">
<html xmlns:th="http://www.thymeleaf.org"></html>
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Đăng nhập</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
</head>
<body class="bg-light">

  <div class="container mt-5">
    <div class="mx-auto" style="max-width: 500px;">
      <div class="bg-white p-4 rounded-4 shadow-sm">
        <h3 class="text-center mb-4 text-primary">Đăng nhập</h3>

        <form>
          <div class="mb-3">
            <label for="username" class="form-label">Tên đăng nhập</label>
            <input type="text" id="username" class="form-control" required />
          </div>

          <div class="mb-3">
            <label for="password" class="form-label">Mật khẩu</label>
            <input type="password" id="password" class="form-control" required />
          </div>

          <div class="d-flex justify-content-between mb-3">
            <div>
              <input type="checkbox" id="remember" />
              <label for="remember">Ghi nhớ</label>
            </div>
            <a href="forgotpassword" class="small">Quên mật khẩu?</a>
          </div>

          <button type="submit" class="btn btn-primary w-100">Đăng nhập</button>
        </form>

        <div class="text-center my-3">
          <span>Hoặc đăng nhập bằng</span>
        </div>

        <div class="d-grid gap-2 mb-3">
          <button class="btn btn-outline-secondary">
            <i class="bi bi-google me-2"></i> Google
          </button>
          <button class="btn btn-outline-secondary">
            <i class="bi bi-envelope me-2"></i> Gmail
          </button>
          <button class="btn btn-outline-secondary">
            <i class="bi bi-facebook me-2 text-primary"></i> Facebook
          </button>
        </div>

        <div class="text-center">
          <span>Chưa có tài khoản?</span>
          <a href="register" class="text-decoration-none fw-bold ms-1">Đăng ký</a>
        </div>
      </div>
    </div>
  </div>

</body>
</html>
