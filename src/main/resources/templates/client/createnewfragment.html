<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Tạo chủ đề mới</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css" />
</head>

<body class="bg-white text-dark">
    <div class="d-flex min-vh-100">
          <!-- Sidebar -->
        <div th:replace="~{client/layout/sidebar :: sidebar}"></div>
        <!-- Main content -->
        <main class="flex-grow-1 d-flex flex-column">
            <!-- Top bar -->
            <div th:replace="~{client/layout/topbar :: topbar}"></div>

            <!-- Content grid -->
            <div class=" container center">
                <section class="flex-grow-1 overflow-auto p-4">
                    
                    <div class="bg-white shadow p-4 w-100 mx-auto" style="max-width: 420px; position: relative; ">
                    
                        <h2 class="fw text-center mb-4">Bạn muốn tạo gì?</h2>

                        <a href="createNewCategory" class="btn w-100 mb-3 py-3 fw-semibold border-0"
                            style="background-color:  #7c3aed; color: white;">
                            Tạo chủ đề mới
                        </a>

                        <a href="CreateQuiz" class="btn w-100 py-3 fw-semibold border-0"
                            style="background-color:  #7c3aed; color: white;">
                            Tạo quiz mới
                        </a>
                    </div>

                    
                </section>
            </div>

        </main>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
