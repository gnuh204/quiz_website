<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Tạo chủ đề mới - QuizArcade</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css" />
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f8f9fa;
        }
        .creation-card {
            transition: all 0.3s ease;
            border-radius: 12px;
            overflow: hidden;
            border: none;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.05);
        }
        .creation-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.1);
        }
        .creation-card .card-body {
            padding: 2rem;
        }
        .btn-purple {
            background-color: #7c3aed;
            color: white;
        }
        .btn-purple:hover {
            background-color: #6d28d9;
            color: white;
        }
        .choice-container {
            max-width: 500px;
            border-radius: 16px;
            background: white;
        }
        .divider {
            display: flex;
            align-items: center;
            margin: 1.5rem 0;
            color: #6b7280;
        }
        .divider::before, .divider::after {
            content: "";
            flex: 1;
            border-bottom: 1px solid #e5e7eb;
        }
        .divider::before {
            margin-right: 1rem;
        }
        .divider::after {
            margin-left: 1rem;
        }
    </style>
</head>

<body class="bg-light">
    <div class="d-flex min-vh-100">
        <!-- Sidebar -->
        <div th:replace="~{client/layout/sidebar :: sidebar}"></div>
        
        <!-- Main content -->
        <main class="flex-grow-1 d-flex flex-column">
            <!-- Top bar -->
            <div th:replace="~{client/layout/topbar :: topbar}"></div>

            <!-- Content -->
            <div class="container-fluid py-4">
                <div class="row justify-content-center">
                    <div class="col-lg-6">
                        <div class="choice-container shadow-sm p-4 p-md-5 mx-auto animate__animated animate__fadeIn">
                            <h2 class="text-center mb-4 fw-bold text-dark">Bạn muốn tạo gì?</h2>
                            
                            <div class="d-grid gap-3">
                                <a href="createNewCategory" class="btn btn-purple btn-lg py-3 fw-semibold rounded-pill">
                                    <i class="fas fa-folder-plus me-2"></i> Tạo chủ đề mới
                                </a>
                                
                                <div class="divider">hoặc</div>
                                
                                <a href="CreateQuiz" class="btn btn-purple btn-lg py-3 fw-semibold rounded-pill">
                                    <i class="fas fa-question-circle me-2"></i> Tạo quiz mới
                                </a>
                            </div>
                            
                            <div class="mt-4 text-center">
                                <a href="/" class="text-decoration-none text-secondary">
                                    <i class="fas fa-arrow-left me-1"></i> Quay lại
                                </a>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // Thêm hiệu ứng khi hover vào các nút
        document.querySelectorAll('.btn').forEach(btn => {
            btn.addEventListener('mouseenter', () => {
                btn.classList.add('shadow');
            });
            btn.addEventListener('mouseleave', () => {
                btn.classList.remove('shadow');
            });
        });
    </script>
</body>
</html>
