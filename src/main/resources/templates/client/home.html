<!DOCTYPE html>
<html lang="en">
<html xmlns:th="http://www.thymeleaf.org"></html>
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Quizizz Student</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css" rel="stylesheet"/>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet"/>
  <style>
    body { font-family: 'Inter', sans-serif; }
    .sidebar { min-width: 220px; max-width: 220px; }
    .sidebar .nav-link.active { color: #7c3aed; font-weight: 600; }
    .sidebar .nav-link { color: #6b7280; }
    .sidebar .nav-link:hover { color: #7c3aed; }
    .tab-active { color: #7c3aed !important; }
    .tab-underline { display: none !important; }
    .bg-purple-50 { background: #f5f3ff; }
    .bg-purple-700 { background: #7c3aed !important; }
    .bg-yellow-400 { background: #facc15 !important; }
    .bg-yellow-500 { background: #eab308 !important; }
    .text-purple-700 { color: #7c3aed !important; }
    .rounded-full { border-radius: 9999px !important; }
    .select-none { user-select: none; }
    .text-9px { font-size: 9px; }
    .text-xs { font-size: 0.75rem; }
    .text-sm { font-size: 0.875rem; }
    .text-lg { font-size: 1.125rem; }
    .font-semibold { font-weight: 600; }
    .font-extrabold { font-weight: 800; }
    .object-contain { object-fit: contain; }
    .illustration-img {
      width: 80px !important;
      height: 80px !important;
      object-fit: contain;
      display: block;
      margin-left: auto;
      margin-right: auto;
      background: #f5f5f5;
      border-radius: 12px;
    }
    .tab-nav-link {
      display: flex;
      flex-direction: column;
      align-items: center;
      min-width: 90px;
      position: relative;
      padding-bottom: 2px;
      background: none;
      border: none;
      cursor: pointer;
      text-align: center;
    }

    .tab-nav-link:not(.tab-active) .tab-underline {
      display: none;
    }
    .tab-nav-link:hover,
    .tab-nav-link:focus {
      color: #7c3aed !important;
      text-decoration: none;
    }
  </style>
</head>
<body class="bg-white text-dark">
  <div class="d-flex min-vh-100">
    <!-- Sidebar -->
    <aside class="sidebar d-flex flex-column border-end bg-white">
      <div class="d-flex align-items-center gap-1 px-4 py-3">
        <h1 class="font-extrabold fs-3 text-purple-700 select-none mb-0">Quizizz</h1>
        <span class="text-xs font-semibold text-secondary pt-1 select-none">STUDENT</span>
      </div>
      <button class="mx-4 mb-3 btn bg-purple-700 text-white text-sm font-semibold py-2 px-3 rounded mb-2" type="button">
        + Tạo mới
      </button>
      <nav class="nav flex-column px-4 mb-2">
        <a class="nav-link active d-flex align-items-center gap-2" href="#">
          <i class="fas fa-home"></i> Khám phá
        </a>
        <a class="nav-link d-flex align-items-center gap-2" href="#">
          <i class="fas fa-book"></i> Thư viện
        </a>
        <a class="nav-link d-flex align-items-center gap-2" href="#">
          <i class="fas fa-chart-bar"></i> Báo cáo
        </a>
      </nav>
      <div class="mt-auto px-4 py-2 text-xs text-secondary select-none">
        0/20 hoạt động được tạo ra
      </div>
      <button class="mx-4 mb-4 btn bg-yellow-400 text-black text-xs font-semibold py-2 px-3 rounded d-flex align-items-center" type="button">
        <i class="fas fa-lock me-1"></i> Nâng cấp
      </button>
    </aside>
    <!-- Main content -->
    <main class="flex-grow-1 d-flex flex-column">
      <!-- Top bar -->
      <header class="d-flex align-items-center justify-content-end gap-2 px-4 py-2 border-bottom bg-white text-xs text-secondary select-none">
        <button class="btn btn-outline-secondary btn-sm d-flex align-items-center gap-1" type="button">
          <i class="fas fa-bell"></i>
        </button>
        <button class="btn btn-outline-secondary btn-sm d-flex align-items-center gap-1" type="button">
          Nhập mã
        </button>
        <button class="btn btn-outline-secondary btn-sm d-flex align-items-center gap-1" type="button">
          <i class="fas fa-question-circle"></i> Nhận trợ giúp
        </button>
        <img alt="User avatar" class="rounded-circle ms-2" height="32" width="32" src="https://storage.googleapis.com/a1aa/image/490413db-25b8-49e6-1e8b-77fb80ba24ef.jpg"/>
      </header>
      <!-- Search and tabs -->
      <section class="bg-purple-50 px-4 py-4">
        <h2 class="text-center font-semibold text-lg mb-3 select-none">Hôm nay bạn dạy gì?</h2>
        <form class="mx-auto" style="max-width: 400px;">
          <label class="visually-hidden" for="search">Tìm kiếm bất kỳ chủ đề nào</label>
          <div class="position-relative">
            <input class="form-control rounded-full py-2 px-4 pe-5 text-sm" id="search" placeholder="Tìm kiếm bất kỳ chủ đề nào" type="search"/>
            <button aria-label="Search" class="btn position-absolute end-0 top-50 translate-middle-y text-secondary" type="submit" style="right: 10px;">
              <i class="fas fa-chevron-right"></i>
            </button>
          </div>
        </form>
  
      </section>
      <!-- Content grid -->
      <section class="flex-grow-1 overflow-auto p-4 bg-light">
        <h3 class="text-xs font-semibold mb-3 select-none">↝ Hoạt động thịnh hành</h3>
        <ul class="row row-cols-2 row-cols-sm-3 row-cols-md-6 g-3 list-unstyled mx-auto" style="max-width: 1200px;">
          <li class="col">
            <div class="bg-white rounded border p-3 d-flex flex-column align-items-center text-center cursor-pointer select-none h-100">
              <img alt="Numbers" class="mb-2 illustration-img" src="https://storage.googleapis.com/a1aa/image/78ca8814-d31f-43b5-c3c9-c223a894fa0c.jpg"/>
              <span class="font-semibold text-xs mb-1">Numbers</span>
              <span class="text-9px text-secondary">779.3K các hoạt động</span>
            </div>
          </li>
          <li class="col">
            <div class="bg-white rounded border p-3 d-flex flex-column text-xs cursor-pointer select-none h-100">
              <img alt="Concepts in whole numbers" class="mb-1 rounded illustration-img" src="https://storage.googleapis.com/a1aa/image/1cce480f-4277-403a-fc7a-94a8488deeac.jpg"/>
              <span class="font-semibold mb-1">Concepts in whole numbers</span>
              <span class="text-9px text-secondary">1.4K các hoạt động</span>
            </div>
          </li>
          <li class="col">
            <div class="bg-white rounded border p-3 d-flex flex-column text-xs cursor-pointer select-none h-100">
              <img alt="Operations on whole numbers" class="mb-1 rounded illustration-img" src="https://storage.googleapis.com/a1aa/image/1cce480f-4277-403a-fc7a-94a8488deeac.jpg"/>
              <span class="font-semibold mb-1">Operations on whole numbers</span>
              <span class="text-9px text-secondary">5K các hoạt động</span>
            </div>
          </li>
          <!-- thêm  -->
        </ul>
      </section>
    </main>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    // filepath: d:\vscode\Html-css\test quizzi\index.html
    document.querySelectorAll('#tabNav .tab-nav-link').forEach(function(tab) {
      tab.addEventListener('click', function(e) {
        e.preventDefault();
        document.querySelectorAll('#tabNav .tab-nav-link').forEach(function(t) {
          t.classList.remove('tab-active');
        });
        tab.classList.add('tab-active');
      });
    });
  </script>
</body>
</html>
