<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Quizizz Student</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css" rel="stylesheet"/>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="styles.css"/>
</head>
<body class="bg-white text-dark">
  <div class="d-flex min-vh-100">
    <!-- Sidebar -->
    <div th:replace="client/layout/sidebar :: sidebar"></div>
    <!-- Main content -->
    <main class="flex-grow-1 d-flex flex-column">
      <!-- Top bar -->
      <div th:replace="client/layout/topbar :: topbar"></div>

      <!-- Content grid -->
      <section class="flex-grow-1 overflow-auto p-4 bg-light">
            <div class="col-md-8 col-lg-9 d-flex flex-column align-items-center justify-content-center text-center">

              <div class="mb-3 fw-semibold fs-5 text-secondary">Tạo quiz hoặc bài học đầu tiên của bạn</div>
              <div class="mb-4 text-secondary" style="font-size:1rem;">
                Lấy các câu hỏi từ thư viện Quizizz hoặc đặt câu hỏi của riêng bạn. Thật nhanh chóng và dễ dàng!
              </div>
              <div class="d-flex justify-content-center gap-3 mb-5">
                <button class="btn btn-primary px-4" style="background:#a78bfa;border:none;">Tạo một bài quiz</button>
                <button class="btn btn-outline-secondary px-4">Tạo một bài học</button>
              </div>
            </div>
      </section>
    </main>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
