<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Quizizz Student</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>

<body class="bg-white text-dark">
  <div class="d-flex min-vh-100">
    <!-- Sidebar -->
    <div th:replace="~{client/layout/sidebar :: sidebar}"></div>
    <!-- Main content -->
    <main class="flex-grow-1 d-flex flex-column ">
      <!-- Top bar -->
      <div th:replace="~{client/layout/topbar :: topbar}"></div>

      <!-- Content grid -->
      <div class="container center">
        <section class="flex-grow-1 overflow-auto p-4">
          <div class="container-fluid">
            <div class="row justify-content-center">
              <div class="col-12 col-md-10 col-lg-8">
                <div class="bg-white rounded-3 shadow-sm p-5 text-center">
                  <!-- Danh sách dữ liệu báo cáo -->
                  <div class="mb-4">
                    <div class="border rounded-3 p-3 bg-light d-flex align-items-center gap-3">
                      <img src="Anh/7a14e25c1c033ea1b7182eea6d54d87e.jpg" alt="Ảnh bài học" class="rounded-3"
                        style="width: 150px; height: 150px; object-fit: cover;">
                      <div class="d-flex flex-column align-items-start gap-2">
                        <div class="fw-semibold"><span class="text-primary">Giải phương trình bậc hai</span>
                        </div>
                        <div>Chủ đề: <span class="fw-semibold">Toán học</span></div>
                        <div>Tác giả: <span class="fw-semibold">Đức Khánh</span></div>
                        <div>Số câu đã tạo: <span class="fw-semibold text-success">15</span></div>
                      </div>
                      <div class="ms-auto">
                        <button class="btn btn-outline-secondary">Xem chi tiết</button>
                      </div>
                      <div>
                        <button class="btn btn-outline-danger">Xóa</button>
                      </div>
                    </div>
                  </div>
                  <!-- Thông báo không có dữ liệu -->
                  <hr>
                  <div class="fw-semibold fs-5 mb-2">Đó là tất cả về dữ liệu!</div>
                  <div class="mb-4 text-secondary">Tạo mới 1 bài tập tại đây</div>
                  <a href="#" class="btn btn-primary px-4" style="background:#8d5fd3;border:none;">Tạo mới</a>
                </div>
              </div>
            </div>
          </div>
        </section>
      </div>

    </main>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
