<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<div th:fragment="topbar">
  <style>
    body {
      font-family: 'Inter', sans-serif;
    }

    .sidebar {
      min-width: 220px;
      max-width: 220px;
    }

    .sidebar .nav-link.active {
      color: #7c3aed;
      font-weight: 600;
    }

    .sidebar .nav-link {
      color: #6b7280;
    }

    .sidebar .nav-link:hover {
      color: #7c3aed;
    }

    .tab-active {
      color: #7c3aed !important;
    }

    .tab-underline {
      display: none !important;
    }

    .bg-purple-50 {
      background: #f5f3ff;
    }

    .bg-purple-700 {
      background: #7c3aed !important;
    }

    .bg-yellow-400 {
      background: #facc15 !important;
    }

    .bg-yellow-500 {
      background: #eab308 !important;
    }

    .text-purple-700 {
      color: #7c3aed !important;
    }

    .rounded-full {
      border-radius: 9999px !important;
    }

    .select-none {
      user-select: none;
    }

    .text-9px {
      font-size: 9px;
    }

    .text-xs {
      font-size: 0.75rem;
    }

    .text-sm {
      font-size: 0.875rem;
    }

    .text-lg {
      font-size: 1.125rem;
    }

    .font-semibold {
      font-weight: 600;
    }

    .font-extrabold {
      font-weight: 800;
    }

    .object-contain {
      object-fit: contain;
    }

    .illustration-img {
      width: 80px !important;
      height: 80px !important;
      object-fit: contain;
      display: block;
      margin-left: auto;
      margin-right: auto;
      background: #f5f5f5;
      border-radius: 12px;
    }

    .tab-nav-link {
      display: flex;
      flex-direction: column;
      align-items: center;
      min-width: 90px;
      position: relative;
      padding-bottom: 2px;
      background: none;
      border: none;
      cursor: pointer;
      text-align: center;
    }

    .tab-nav-link:not(.tab-active) .tab-underline {
      display: none;
    }

    .tab-nav-link:hover,
    .tab-nav-link:focus {
      color: #7c3aed !important;
      text-decoration: none;
    }

    /* Cố định kích thước dropdown menu */
    .dropdown-menu.dropdown-menu-end {
      min-width: 220px;
      max-width: 240px;
      padding: 10px 0;
      box-shadow: 0 4px 24px 0 rgba(60, 72, 88, 0.12);
    }

    .dropdown-menu .dropdown-item {
      padding: 8px 20px;
      font-size: 0.95rem;
    }

    .user-dropdown-menu {
      min-width: 260px;
      max-width: 300px;
      border-radius: 14px;
      box-shadow: 0 4px 24px 0 rgba(60, 72, 88, 0.13);
      padding-top: 0;
      padding-bottom: 0;
    }

    .user-dropdown-menu .dropdown-item {
      font-size: 1rem;
      padding: 10px 24px;
    }

    .user-dropdown-menu .dropdown-divider {
      margin: 0.5rem 0;
    }
  </style>
  <header
    class="d-flex align-items-center justify-content-end gap-2 px-4 py-2 border-bottom bg-white text-xs text-secondary select-none">
    <!-- Các nút chức năng chung -->
    <button class="btn btn-outline-secondary btn-sm d-flex align-items-center gap-1" type="button">
      <i class="fas fa-bell"></i>
    </button>
    <button class="btn btn-outline-secondary btn-sm d-flex align-items-center gap-1" type="button">
      Nhập mã
    </button>
    <button class="btn btn-outline-secondary btn-sm d-flex align-items-center gap-1" type="button">
      <i class="fas fa-question-circle"></i> Nhận trợ giúp
    </button>

    <!-- Phần hiển thị theo trạng thái đăng nhập -->
    <div sec:authorize="isAuthenticated()">
      <div class="dropdown" th:if="${user != null}">
        <a href="#" class="d-flex align-items-center text-decoration-none dropdown-toggle" id="userDropdown"
          data-bs-toggle="dropdown" aria-expanded="false">
          <!-- Sử dụng onerror để xử lý khi ảnh không tải được -->
          <img alt="User avatar" class="rounded-circle" height="40" width="40" th:src="${user.imgurl != null and user.imgurl.startsWith('http')} ? 
               ${user.imgurl} : 
               @{/images/default-avatar.jpg}" style="object-fit: cover;"
            onerror="this.onerror=null; this.src='/images/default-avatar.jpg'" />
          <span class="ms-2 text-dark fw-semibold" th:text="${user.username} ?: 'User'">User</span>
        </a>
        <ul class="dropdown-menu dropdown-menu-end user-dropdown-menu" aria-labelledby="userDropdown">
          <li class="px-3 pt-3 pb-2 text-center">
            <!-- Ảnh lớn trong dropdown -->
            <img th:src="${user.imgurl != null and user.imgurl.startsWith('http')} ? 
                  ${user.imgurl} : 
                  @{/images/default-avatar.jpg}" class="rounded-circle mb-2" width="48" height="48" alt="avatar"
              style="object-fit:cover" onerror="this.onerror=null; this.src='/images/default-avatar.jpg'">
            <div class="fw-semibold" th:text="${user.username} ?: 'User'">User</div>
            <div class="text-secondary small" th:text="${user.email} ?: ''">Email</div>
          </li>
          <li>
            <hr class="dropdown-divider">
          </li>
          <li><a class="dropdown-item d-flex align-items-center gap-2" href="InforFragment">
              <i class="fas fa-user"></i> Xem hồ sơ</a></li>
          <li><a class="dropdown-item d-flex align-items-center gap-2" href="Setting">
              <i class="fas fa-cog"></i> Cài đặt</a></li>
          <li><form  class="dropdown-item d-flex align-items-center gap-2" th:action="@{/logout}" method="post" id="logoutForm">
  <button type="submit" class="dropdown-item d-flex align-items-center gap-2">
    <i class="fas fa-sign-out-alt"></i> Đăng xuất
  </button></form></li>
        </ul>
      </div>
    </div>

    <div sec:authorize="isAnonymous()">
      <!-- Hiển thị khi chưa đăng nhập -->
      <a class="btn btn-outline-primary" href="/login">Đăng nhập</a>
    </div>
  </header>
</div>

</html>
