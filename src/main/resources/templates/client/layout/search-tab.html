<div th:fragment="searchAndTab">
  <section class="bg-purple-50 px-4 py-4">
    <h2 class="text-center font-semibold text-lg mb-3 select-none">Hôm nay bạn dạy gì?</h2>
    <form class="mx-auto" style="max-width: 400px;">
      <label class="visually-hidden" for="search">Tìm kiếm bất kỳ chủ đề nào</label>
      <div class="position-relative">
        <input class="form-control rounded-full py-2 px-4 pe-5 text-sm" id="search" placeholder="Tìm kiếm bất kỳ chủ đề nào" type="search"/>
        <button aria-label="Search" class="btn position-absolute end-0 top-50 translate-middle-y text-secondary" type="submit" style="right: 10px;">
          <i class="fas fa-chevron-right"></i>
        </button>
      </div>
    </form>
  </section>
</div>
