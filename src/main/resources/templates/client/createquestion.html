<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Tạo một Quiz mới</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css" rel="stylesheet" />

</head>

<body class="bg-white text-dark">
    <div class="d-flex min-vh-100">
        <!-- Sidebar -->
        <div th:replace="~{client/layout/sidebar :: sidebar}"></div>
        <!-- Main content -->
        <main class="flex-grow-1 d-flex flex-column">
            <!-- Top bar -->
            <div th:replace="~{client/layout/topbar :: topbar}"></div>

            <!-- Content grid -->
            <section class="flex-grow-1 overflow-auto p-4 bg-light">
                <main class="container my-5">
                    <section class="bg-white rounded-3 p-4 shadow-sm mx-auto" style="max-width: 950px;">
                        <h2 class="fw-bold fs-5 mb-4">Thêm câu hỏi vào Quiz</h2>

                        <form id="quizForm">
                            <div class="mb-3">
                                <label for="quizDescription" class="form-label">Nội dung câu hỏi</label>
                                <textarea class="form-control" id="quizDescription" rows="3"
                                    placeholder="Nhập nội dung câu hỏi..."></textarea>
                            </div>

                            <div class="row g-3 mb-4">
                                <div class="col-md-9">
                                    <div class="mb-3">
                                        <label for="quizCategory" class="form-label">Chọn loại đáp án</label>
                                        <select class="form-select" id="quizCategory">
                                            <option selected disabled hidden></option>
                                            <option value="Chọn một đáp án">Chọn một đáp án</option>
                                            <option value="Chọn nhiều đáp án">Chọn nhiều đáp án</option>
                                        </select>
                                    </div>

                                    <div class="mb-3">
                                        <label for="quizImage" class="form-label">Chọn ảnh</label>
                                        <input type="file" class="form-control" id="quizImage" accept="image/*" />
                                    </div>
                                </div>

                                <div class="col-md-3 d-flex align-items-start justify-content-center">
                                    <div style="
              width: 150px;
              height: 150px;
              border: 1px solid #ccc;
              background: #fafafa;
              border-radius: 8px;
              overflow: hidden;
              margin-top: 20px;
              margin-left: 55px;
            ">
                                        <img id="imagePreview"
                                            style="width: 100%; height: 100%; object-fit: cover; display: none;" />
                                    </div>
                                </div>
                            </div>

                            <div class="mb-4">
                                <label class="form-label">Đáp án A</label>
                                <div class="input-group mb-2">
                                    <div class="input-group-text">
                                        <input class="form-check-input mt-0" type="checkbox" name="correctAnswer"
                                            value="1" />
                                    </div>
                                    <input type="text" class="form-control" placeholder="Đáp án A" name="answer1" />
                                </div>

                                <label class="form-label">Đáp án B</label>
                                <div class="input-group mb-2">
                                    <div class="input-group-text">
                                        <input class="form-check-input mt-0" type="checkbox" name="correctAnswer"
                                            value="2" />
                                    </div>
                                    <input type="text" class="form-control" placeholder="Đáp án B" name="answer2" />
                                </div>

                                <label class="form-label">Đáp án C</label>
                                <div class="input-group mb-2">
                                    <div class="input-group-text">
                                        <input class="form-check-input mt-0" type="checkbox" name="correctAnswer"
                                            value="3" />
                                    </div>
                                    <input type="text" class="form-control" placeholder="Đáp án C" name="answer3" />
                                </div>

                                <label class="form-label">Đáp án D</label>
                                <div class="input-group mb-2">
                                    <div class="input-group-text">
                                        <input class="form-check-input mt-0" type="checkbox" name="correctAnswer"
                                            value="4" />
                                    </div>
                                    <input type="text" class="form-control" placeholder="Đáp án D" name="answer4" />
                                </div>
                            </div>

                            <div class="row mb-4">
                                <div class="col-12 d-flex justify-content-center gap-2">
                                    <button type="button" class="btn"
                                        style="background-color: purple; color: white; width: 140px;">Lưu câu
                                        hỏi</button>
                                </div>
                            </div>
                        </form>
                    </section>
                </main>

                <script>
                    const quizImage = document.getElementById('quizImage');
                    const imagePreview = document.getElementById('imagePreview');

                    quizImage.addEventListener('change', function (event) {
                        const file = event.target.files[0];
                        if (file) {
                            const reader = new FileReader();
                            reader.onload = function (e) {
                                imagePreview.src = e.target.result;
                                imagePreview.style.display = 'block';
                            };
                            reader.readAsDataURL(file);
                        } else {
                            imagePreview.style.display = 'none';
                        }
                    });
                </script>
            </section>
        </main>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
