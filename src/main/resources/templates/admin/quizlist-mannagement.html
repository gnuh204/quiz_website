<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Quizizz Student</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap"
        rel="stylesheet" />
    <style>
        :root {
            --primary-color: #7c3aed;
            --primary-light: #8b5cf6;
            --primary-dark: #6d28d9;
            --secondary-color: #f9fafb;
            --text-color: #334155;
            --text-light: #64748b;
            --border-color: #e2e8f0;
            --card-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -2px rgba(0, 0, 0, 0.1);
            --card-hover-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -4px rgba(0, 0, 0, 0.1);
            --transition: all 0.3s ease;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: #f8fafc;
            color: var(--text-color);
        }

        .category-header {
            background: linear-gradient(135deg, #f9fafb 0%, #f3f4f6 100%);
            border-radius: 1rem;
            padding: 2rem;
            margin-bottom: 2rem;
            border: 1px solid var(--border-color);
            transition: var(--transition);
        }

        .category-header:hover {
            box-shadow: var(--card-shadow);
        }

        .category-image {
            width: 180px;
            height: 180px;
            object-fit: cover;
            box-shadow: 0 4px 6px rgba(124, 58, 237, 0.1);
        }

        .category-title {
            font-weight: 700;
            font-size: 2.5rem;
            color: var(--primary-dark);
            margin-bottom: 0.5rem;
            line-height: 1.2;
        }

        .quiz-card {
            background: white;
            border-radius: 1rem;
            padding: 1.5rem;
            margin-bottom: 1.5rem;
            border: 1px solid var(--border-color);
            transition: var(--transition);
            box-shadow: var(--card-shadow);
        }

        .quiz-card:hover {
            transform: translateY(-5px);
            box-shadow: var(--card-hover-shadow);
            border-color: var(--primary-light);
        }

        .quiz-image {
            width: 140px;
            height: 140px;
            object-fit: cover;
            border-radius: 0.75rem;
            border: 3px solid white;
        }

        .quiz-title {
            font-weight: 600;
            font-size: 1.25rem;
            color: var(--primary-dark);
            margin-bottom: 0.5rem;
        }

        .quiz-meta {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }

        .meta-item {
            display: flex;
            align-items: center;
            font-size: 0.9rem;
            color: var(--text-light);
        }

        .meta-item i {
            margin-right: 0.5rem;
            color: var(--primary-color);
            width: 20px;
            text-align: center;
        }

        .btn-details {
            background-color: white;
            color: var(--primary-color);
            border: 2px solid var(--primary-color);
            border-radius: 0.5rem;
            padding: 0.5rem 1.5rem;
            font-weight: 500;
            transition: var(--transition);
        }

        .btn-details:hover {
            background-color: var(--primary-color);
            color: white;
            transform: translateY(-2px);
        }

        .empty-state {
            padding: 3rem 0;
            color: var(--text-light);
        }

        .empty-state i {
            font-size: 3rem;
            color: var(--primary-light);
            margin-bottom: 1rem;
        }

        @media (max-width: 768px) {
            .category-header {
                flex-direction: column;
                text-align: center;
            }

            .category-image {
                width: 120px;
                height: 120px;
                margin-bottom: 1rem;
            }

            .quiz-card {
                flex-direction: column;
            }

            .quiz-image {
                width: 100%;
                height: 180px;
                margin-bottom: 1rem;
            }

            .quiz-meta {
                margin-bottom: 1rem;
            }

            .btn-details {
                width: 100%;
            }
        }
    </style>
</head>

<body class="bg-light">

    <div class="container">
        <div class="row justify-content-center">
            <div class="col-12 col-lg-10 col-xl-8">
                <!-- Category Header -->
                <div class="category-header d-flex align-items-center gap-4 flex-wrap">
                    <img th:src="@{'/images/topicimages/'+${category.imageUrl}}" alt="Category image"
                        class="category-image">
                    <div>
                        <h1 class="category-title" th:text="${category.name}">TOÁN HỌC</h1>
                        <div class="d-flex align-items-center gap-3">
                            <div class="meta-item">
                                <i class="fas fa-book-open"></i>
                                <span>Tổng số bài học: <span class="fw-semibold"
                                        th:text="${quizzes.size()}">20</span></span>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Quizzes List -->
                <div th:if="${!quizzes.isEmpty()}" class="quizzes-list">
                    <h3 class="mb-4 fw-semibold text-primary">
                        <i class="fas fa-list-check me-2"></i>Danh sách bài học
                    </h3>

                    <div th:each="quiz : ${quizzes}" class="quiz-card d-flex align-items-center gap-4 flex-wrap">
                        <img th:src="@{'/images/quizImages/'+${quiz.imageUrl}}" alt="Quiz image" class="quiz-image">
                        <div class="flex-grow-1">
                            <h4 class="quiz-title" th:text="${quiz.title}">Tên quiz</h4>
                            <div class="quiz-meta">
                                <div class="meta-item">
                                    <i class="fas fa-tag"></i>
                                    <span>Chủ đề: <span th:text="${quiz.category.name}">Tên chủ đề</span></span>
                                </div>
                                <div class="meta-item">
                                    <i class="fas fa-user"></i>
                                    <span>Tác giả: <span th:text="${quiz.createdBy.username}">Tác giả</span></span>
                                </div>
                                <div class="meta-item">
                                    <i class="fas fa-question-circle"></i>
                                    <span>Số câu hỏi: <span class="text-success fw-semibold"
                                            th:text="${#lists.size(quiz.questions)}">10</span></span>
                                </div>
                                <div class="meta-item">
                                    <i class="fas fa-clock"></i>
                                    <span>Thời gian: <span class="text-success fw-semibold"
                                            th:text="${quiz.timeLimitMinutes}">15</span> phút</span>
                                </div>
                            </div>
                        </div>

                        <div class="ms-md-auto">
                            <form
                                th:action="@{/admin/topics/quizzes/delete/{quizId}/{categoryId}(quizId=${quiz.quizId}, categoryId=${quiz.category.categoryId})}"
                                method="post" onsubmit="return confirm('Bạn có chắc muốn xoá quiz này không?')">
                                <button type="submit" class="btn btn-danger btn-sm rounded-circle" title="Xoá quiz">
                                    <i class="fas fa-trash-alt"></i>
                                </button>
                            </form>

                        </div>
                    </div>
                </div>

                <!-- Empty State -->
                <div th:if="${quizzes.isEmpty()}" class="empty-state text-center">
                    <i class="fas fa-book-open"></i>
                    <h4 class="fw-semibold">Chưa có bài học nào</h4>
                    <p class="text-muted">Hiện tại chưa có bài học nào trong danh mục này</p>
                </div>

                <div th:if="${!quizzes.isEmpty()}" class="text-center mt-5 text-muted">
                    <i class="fas fa-check-circle me-2"></i>Đã hiển thị tất cả bài học
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // Add subtle animation to cards when page loads
        document.addEventListener('DOMContentLoaded', function () {
            const cards = document.querySelectorAll('.quiz-card');
            cards.forEach((card, index) => {
                setTimeout(() => {
                    card.style.opacity = '1';
                    card.style.transform = 'translateY(0)';
                }, index * 100);
            });
        });
    </script>
</body>

</html>
