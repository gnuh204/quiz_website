<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Quizizz Student</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap"
        rel="stylesheet" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css" />
    <style>
        :root {
            --primary-color: #7c3aed;
            --primary-light: #8b5cf6;
            --primary-dark: #6d28d9;
            --secondary-color: #f9fafb;
            --text-color: #334155;
            --text-light: #64748b;
            --border-color: #e2e8f0;
            --card-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -2px rgba(0, 0, 0, 0.1);
            --card-hover-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -4px rgba(0, 0, 0, 0.1);
            --transition: all 0.3s ease;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: #f8fafc;
            color: var(--text-color);
        }

        .section-title {
            font-weight: 600;
            font-size: 1.5rem;
            margin-bottom: 1.5rem;
            color: var(--primary-dark);
            position: relative;
            padding-left: 1rem;
        }

        .section-title::before {
            content: '';
            position: absolute;
            left: 0;
            top: 0;
            height: 100%;
            width: 4px;
            background-color: var(--primary-color);
            border-radius: 4px;
        }

        .category-card {
            border: none;
            border-radius: 1rem;
            overflow: hidden;
            transition: var(--transition);
            box-shadow: var(--card-shadow);
            height: 100%;
        }

        .category-card:hover {
            transform: translateY(-5px);
            box-shadow: var(--card-hover-shadow);
        }

        .category-card img {
            height: 180px;
            object-fit: cover;
            transition: var(--transition);
        }

        .category-card:hover img {
            transform: scale(1.05);
        }

        .category-card .card-body {
            padding: 1.25rem;
        }

        .category-card .card-title {
            font-weight: 600;
            color: var(--text-color);
            margin-bottom: 0.5rem;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .category-card .card-footer {
            background: transparent;
            border-top: none;
            padding: 0 1.25rem 1.25rem;
        }

        .category-card .btn-explore {
            background-color: var(--primary-color);
            color: white;
            border: none;
            border-radius: 0.5rem;
            padding: 0.5rem 1rem;
            font-weight: 500;
            transition: var(--transition);
            width: 100%;
        }

        .category-card .btn-explore:hover {
            background-color: var(--primary-dark);
        }

        .empty-state {
            padding: 3rem 0;
            text-align: center;
        }

        .empty-state i {
            font-size: 3rem;
            color: var(--primary-light);
            margin-bottom: 1rem;
        }

        @media (max-width: 768px) {
            .section-title {
                font-size: 1.25rem;
            }

            .category-card img {
                height: 120px;
            }
        }
    </style>
</head>

<body class="bg-light">
    <div class="d-flex min-vh-100">
        <section class="flex-grow-1 overflow-auto p-4">
            <div class="container">
                <div class="d-flex justify-content-between align-items-center mb-4">
                    <h3 class="section-title animate__animated animate__fadeIn"> Tất cả chủ đề</h3>
                </div>

                <div th:if="${!categorys.isEmpty()}"
                    class="row row-cols-1 row-cols-md-2 row-cols-lg-3 row-cols-xl-4 g-4">
                    <div class="col animate__animated animate__fadeInUp" th:each="category, iter : ${categorys}"
                        th:attr="style='animation-delay:${iter.index * 0.1}s;'">
                        <div class="position-relative h-100">
                            <!-- Nút xoá -->
                            <form th:action="@{/admin/topics/delete/{id}(id=${category.categoryId})}" method="post"
                                th:object="${category}"
                                onsubmit="return confirm('Bạn có chắc muốn xoá chủ đề này không?')"
                                class="position-absolute top-0 end-0 m-2 z-3">
                                <button type="submit" class="btn btn-sm btn-danger rounded-circle" title="Xoá">
                                    <i class="fas fa-trash-alt"></i>
                                </button>
                            </form>

                            <form th:action="@{/admin/topics/quiz/{id}(id=${category.categoryId})}" method="get" class="h-100">
    <button type="submit" class="btn-explore w-100 h-100 text-start border-0 bg-transparent p-0">
        <div class="category-card h-100">
            <img th:src="@{'/images/topicimages/' + ${category.imageUrl}}" alt="Ảnh chủ đề"
                 class="card-img-top w-100">
            <div class="card-body">
                <h5 class="card-title" th:text="${category.name}">Tên chủ đề</h5>
            </div>
            <div class="card-footer">
                <span class="btn-explore">
                    <i class="fas fa-arrow-right me-1"></i> Khám phá
                </span>
            </div>
        </div>
    </button>
</form>

                        </div>
                    </div>

                </div>

                <div th:if="${categorys.isEmpty()}" class="empty-state">
                    <i class="fas fa-book-open"></i>
                    <h4 class="fw-semibold">Không có chủ đề nào</h4>
                    <p class="text-muted">Hiện tại không có chủ đề nào để hiển thị</p>
                </div>
            </div>
        </section>
        </main>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // Thêm hiệu ứng khi scroll
        document.addEventListener('DOMContentLoaded', function () {
            const observer = new IntersectionObserver((entries) => {
                entries.forEach(entry => {
                    if (entry.isIntersecting) {
                        entry.target.classList.add('animate__fadeInUp');
                        observer.unobserve(entry.target);
                    }
                });
            }, { threshold: 0.1 });

            document.querySelectorAll('.category-card').forEach(card => {
                observer.observe(card);
            });
        });
    </script>
</body>

</html>
