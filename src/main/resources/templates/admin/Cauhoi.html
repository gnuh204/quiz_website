<!-- templates/Cauhoi.html -->
<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Thêm câu hỏi</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-900 text-white p-6">
  <h1 class="text-2xl font-bold mb-6">➕ Thêm câu hỏi vào Quiz</h1>

  <form th:action="@{/admin/question/add}" method="post" class="space-y-4 max-w-2xl">
    <div>
      <label class="block mb-1">Nội dung câu hỏi</label>
      <textarea name="questionText" rows="3" class="w-full p-3 rounded bg-gray-800 border border-gray-700" required></textarea>
    </div>

    <div>
      <label class="block mb-1">Đáp án A</label>
      <input type="text" name="optionA" class="w-full p-2 rounded bg-gray-800 border border-gray-700" required>
    </div>

    <div>
      <label class="block mb-1">Đáp án B</label>
      <input type="text" name="optionB" class="w-full p-2 rounded bg-gray-800 border border-gray-700" required>
    </div>

    <div>
      <label class="block mb-1">Đáp án C</label>
      <input type="text" name="optionC" class="w-full p-2 rounded bg-gray-800 border border-gray-700" required>
    </div>

    <div>
      <label class="block mb-1">Đáp án D</label>
      <input type="text" name="optionD" class="w-full p-2 rounded bg-gray-800 border border-gray-700" required>
    </div>

    <div>
      <label class="block mb-1">Đáp án đúng</label>
      <select name="correctAnswer" class="w-full p-2 rounded bg-gray-800 border border-gray-700">
        <option value="A">A</option>
        <option value="B">B</option>
        <option value="C">C</option>
        <option value="D">D</option>
      </select>
    </div>

    <div>
      <label class="block mb-1">Quiz ID</label>
      <input type="number" name="quizId" class="w-full p-2 rounded bg-gray-800 border border-gray-700" required>
    </div>

    <button type="submit" class="bg-green-600 px-4 py-2 rounded hover:bg-green-500">Lưu câu hỏi</button>
  </form>
</body>
</html>
