<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">

<head>
  <meta charset="UTF-8" />
  <title>Quản lý Quiz</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" />
</head>

<body class="bg-gray-900">

  <div class="container my-5" style="max-width: 950px;">

    <nav class="bg-dark rounded-top px-3 py-2 mb-0 d-flex justify-between text-center">
      <button class="btn btn-dark border-0 text-white flex-fill" onclick="showTab('tab1', event)">Tạo chủ đề</button>
      <button class="btn btn-dark border-0 text-white flex-fill" onclick="showTab('tab2', event)">Tạo Quiz</button>
      <button class="btn btn-dark border-0 text-white flex-fill" onclick="showTab('tab3', event)">Thêm câu hỏi</button>
    </nav>

    <!--Tạo Chủ Đề -->
    <section id="tab1" class="bg-white p-4 rounded-bottom shadow-sm">
      <h2 class="fw-bold fs-5 mb-4">Tạo chủ đề mới</h2>
      <form>
        <div class="row g-3 mb-4">
          <div class="col-md-9">
            <div class="mb-3">
              <label class="form-label">Nhập tên chủ đề</label>
              <input type="text" class="form-control" placeholder="Tên chủ đề..." />
            </div>

            <div class="mb-3">
              <label for="quizImage" class="form-label">Chọn ảnh</label>
              <input type="file" class="form-control" id="quizImage" accept="image/*" />
            </div>
          </div>

          <div class="col-md-3 d-flex align-items-start justify-content-center">
            <div style="
              width: 150px;
              height: 150px;
              border: 1px solid #ccc;
              background: #fafafa;
              border-radius: 8px;
              overflow: hidden;
              margin-top: 25px;
            ">
              <img id="imagePreview" class="img-fluid"
                style="width: 100%; height: 100%; object-fit: cover; display: none;" />
            </div>
          </div>
        </div>
        <div class="text-center mt-4">
          <button type="button" class="btn" style="background-color:  #7c3aed; color: white; width: 140px;">Lưu chủ
            đề</button>
        </div>
      </form>
    </section>

    <!--Tạo Quiz -->
    <section id="tab2" class="bg-white p-4 rounded-bottom shadow-sm d-none">
      <h2 class="fw-bold fs-5 mb-4">Tạo một quiz mới</h2>
      <form>
        <div class="mb-3">
          <label class="form-label">Tên quiz</label>
          <input type="text" class="form-control" placeholder="Nhập tên quiz" />
        </div>
        <div class="mb-3">
          <label class="form-label">Mô tả Quiz</label>
          <textarea class="form-control" rows="3" placeholder="Nhập mô tả quiz..."></textarea>
        </div>
        <div class="row g-3 mb-4">
          <div class="col-md-9">
            <div class="mb-3">
              <label class="form-label">Chọn chủ đề</label>
              <select class="form-select">
                <option selected disabled hidden></option>
              </select>
            </div>
            <div class="mb-3">
              <label for="quizImage" class="form-label">Chọn ảnh</label>
              <input type="file" class="form-control" id="quizImage" accept="image/*" />
            </div>
          </div>

          <div class="col-md-3 d-flex align-items-start justify-content-center">
            <div style="
              width: 150px;
              height: 150px;
              border: 1px solid #ccc;
              background: #fafafa;
              border-radius: 8px;
              overflow: hidden;
              margin-top: 20px;
              margin-left: 55px;
            ">
              <img id="imagePreview" style="width: 100%; height: 100%; object-fit: cover; display: none;" />
            </div>
          </div>
        </div>

        <div class="mb-4">
          <label class="form-label">Giới hạn thời gian (phút)</label>
          <input type="number" class="form-control" placeholder="Nhập số phút" min="1" />
        </div>
        <div class="col-12 d-flex justify-content-center gap-2">
          <button type="button" class="btn" style="background-color: #7c3aed; color: white; width: 140px;">Lưu
            Quiz</button>
        </div>
      </form>
    </section>

    <!--Thêm Câu Hỏi -->
    <section id="tab3" class="bg-white p-4 rounded-bottom shadow-sm d-none">
      <h2 class="fw-bold fs-5 mb-4">Thêm câu hỏi vào Quiz</h2>
      <form>
        <div class="mb-3">
          <label class="form-label">Nội dung câu hỏi</label>
          <textarea class="form-control" rows="3" placeholder="Nhập nội dung câu hỏi..."></textarea>
        </div>
        <div class="row g-3 mb-4">
          <div class="col-md-9">
            <div class="mb-3">
              <label for="quizCategory" class="form-label">Chọn loại đáp án</label>
              <select class="form-select">
                <option selected disabled hidden></option>
                <option value="1">Chọn một đáp án</option>
                <option value="2">Chọn nhiều đáp án</option>
              </select>
            </div>
            <div class="mb-3">
              <label for="quizImage" class="form-label">Chọn ảnh</label>
              <input type="file" class="form-control" id="quizImage" accept="image/*" />
            </div>
          </div>

          <div class="col-md-3 d-flex align-items-start justify-content-center">
            <div style="
              width: 150px;
              height: 150px;
              border: 1px solid #ccc;
              background: #fafafa;
              border-radius: 8px;
              overflow: hidden;
              margin-top: 20px;
              margin-left: 55px;
            ">
              <img id="imagePreview" style="width: 100%; height: 100%; object-fit: cover; display: none;" />
            </div>
          </div>
        </div>

        <div class="mb-4">
          <label class="form-label">Đáp án A</label>
          <div class="input-group mb-2">
            <div class="input-group-text">
              <input type="checkbox" class="form-check-input mt-0" />
            </div>
            <input type="text" class="form-control" placeholder="Đáp án A" />
          </div>

          <label class="form-label">Đáp án B</label>
          <div class="input-group mb-2">
            <div class="input-group-text">
              <input type="checkbox" class="form-check-input mt-0" />
            </div>
            <input type="text" class="form-control" placeholder="Đáp án B" />
          </div>

          <label class="form-label">Đáp án C</label>
          <div class="input-group mb-2">
            <div class="input-group-text">
              <input type="checkbox" class="form-check-input mt-0" />
            </div>
            <input type="text" class="form-control" placeholder="Đáp án C" />
          </div>

          <label class="form-label">Đáp án D</label>
          <div class="input-group mb-2">
            <div class="input-group-text">
              <input type="checkbox" class="form-check-input mt-0" />
            </div>
            <input type="text" class="form-control" placeholder="Đáp án D" />
          </div>
        </div>

        <div class="col-12 d-flex justify-content-center gap-2">
          <button type="button" class="btn" style="background-color: #7c3aed; color: white; width: 140px;">Lưu câu
            hỏi</button>
      </form>
    </section>
  </div>

  <script>
    function showTab(id, event) {
      document.querySelectorAll("section").forEach(s => s.classList.add("d-none"));
      document.getElementById(id).classList.remove("d-none");

      document.querySelectorAll("nav .btn").forEach(btn => btn.classList.remove("active-tab"));
      event.target.classList.add("active-tab");
    }

    function setupImagePreview(inputId, previewId) {
      const input = document.getElementById(inputId);
      const preview = document.getElementById(previewId);
      input.addEventListener('change', function (event) {
        const file = event.target.files[0];
        if (file) {
          const reader = new FileReader();
          reader.onload = function (e) {
            preview.src = e.target.result;
            preview.style.display = 'block';
          };
          reader.readAsDataURL(file);
        } else {
          preview.style.display = 'none';
        }
      });
    }
  </script>

  <style>
    .active-tab {
      background-color: #7c3aed;
    }
  </style>

</body>
</html>
