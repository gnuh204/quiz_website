<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Tạo tài khoản Admin</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet" />
</head>
<body class="bg-light">

  <div class="container mt-5">
    <div class="mx-auto" style="max-width: 500px;">
      <div class="bg-white p-4 rounded-4 shadow-sm">
        <h3 class="text-center mb-4 text-primary">Tạo tài khoản Admin</h3>

        <form th:action="@{/admin/register}" th:object="${admin}" method="post">
          <!-- Hiển thị lỗi tổng quát nếu có -->
          <div th:if="${#fields.hasGlobalErrors()}" class="text-danger">
            <p th:each="err : ${#fields.globalErrors()}" th:text="${err}"></p>
          </div>

          <!-- Tên người dùng -->
          <div class="mb-3">
            <label for="username" class="form-label">Tên người dùng</label>
            <input type="text" id="username" th:field="*{username}" class="form-control" required />
            <div th:if="${#fields.hasErrors('username')}" class="text-danger">
              <p th:each="err : ${#fields.errors('username')}" th:text="${err}"></p>
            </div>
          </div>

          <!-- Email -->
          <div class="mb-3">
            <label for="email" class="form-label">Email</label>
            <input type="email" id="email" th:field="*{email}" class="form-control" required />
            <div th:if="${#fields.hasErrors('email')}" class="text-danger">
              <p th:each="err : ${#fields.errors('email')}" th:text="${err}"></p>
            </div>
          </div>

          <!-- Mật khẩu -->
          <div class="mb-3">
            <label for="password" class="form-label">Mật khẩu</label>
            <input type="password" id="password" th:field="*{password}" class="form-control" required />
            <div th:if="${#fields.hasErrors('password')}" class="text-danger">
              <p th:each="err : ${#fields.errors('password')}" th:text="${err}"></p>
            </div>
          </div>

          <!-- Vai trò -->
          <div class="mb-3">
            <label for="role" class="form-label">Vai trò</label>
            <select id="role" th:field="*{role}" class="form-select" required>
              <option value="" disabled selected>-- Chọn vai trò --</option>
              <option value="ADMIN">Admin</option>
              <option value="USER">User</option>
            </select>
            <div th:if="${#fields.hasErrors('role')}" class="text-danger">
              <p th:each="err : ${#fields.errors('role')}" th:text="${err}"></p>
            </div>
          </div>

          <!-- Nút đăng ký -->
          <button type="submit" class="btn btn-primary w-100">Đăng ký</button>
        </form>

        <!-- Đăng ký bằng mạng xã hội -->
        <div class="text-center my-3">
          <span>Hoặc đăng ký bằng</span>
        </div>

        <div class="d-grid gap-2 mb-3">
          <button class="btn btn-outline-secondary">
            <i class="bi bi-google me-2"></i> Google
          </button>
          <button class="btn btn-outline-secondary">
            <i class="bi bi-envelope me-2"></i> Gmail
          </button>
          <button class="btn btn-outline-secondary">
            <i class="bi bi-facebook me-2 text-primary"></i> Facebook
          </button>
        </div>

        <!-- Đã có tài khoản -->
        <div class="text-center">
          <span>Đã có tài khoản?</span>
          <a th:href="@{/login}" class="text-decoration-none fw-bold ms-1">Đăng nhập</a>
        </div>
      </div>
    </div>
  </div>

</body>
</html>
