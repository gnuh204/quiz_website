<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Dashboard - QuizArcade</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-900 text-white min-h-screen flex">

  <!-- Sidebar -->
  <aside class="w-64 bg-gray-800 flex flex-col p-4 space-y-6">
    <div class="text-2xl font-bold text-white">🎮 QuizArcade</div>
    <nav class="flex flex-col space-y-2">
      <a href="#" th:attr="data-href=@{/admin/dashboard}" class="text-left text-gray-300 hover:text-white sidebar-link">🏠 Trang chủ</a>
      <a href="#" th:attr="data-href=@{/admin/accounts}" class="text-left text-gray-300 hover:text-white sidebar-link">👤 Quản lý tài khoản</a>
      <a href="#" th:attr="data-href=@{/admin/quizzes}" class="text-left text-gray-300 hover:text-white sidebar-link">📝 Quản lý Quiz</a>
      <a href="#" th:attr="data-href=@{/admin/question/add}" class="text-left text-gray-300 hover:text-white sidebar-link">➕ Tạo Quiz</a>
      <a th:href="@{/logout}" class="text-red-400 hover:text-red-200">🔓 Đăng xuất</a>
    </nav>
  </aside>

  <!-- Nội dung chính qua iframe -->
  <main class="flex-1 p-4">
    <iframe id="mainFrame" th:src="@{/admin/dashboard}" class="w-full h-screen rounded-xl" frameborder="0"></iframe>
  </main>

  <script>
    document.querySelectorAll('.sidebar-link').forEach(link => {
      link.addEventListener('click', function(event) {
        event.preventDefault();
        const url = this.getAttribute('data-href');
        console.log("Load iframe url:", url);
        if (url) {
          document.getElementById('mainFrame').src = url;
        }
      });
    });
  </script>
</body>
</html>
