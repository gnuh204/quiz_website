<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Danh sách chủ đề</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" />
</head>
<body class="bg-light">

<div class="container my-5">
    <h2 class="mb-4">Danh sách chủ đề</h2>

   <div class="row row-cols-1 row-cols-md-3 g-4">
    <div class="col" th:each="topic : ${topics}">
        <div class="card h-100">

            <!-- DEBUG: In ra tên file ảnh -->
            <p class="text-muted" th:text="'Tên ảnh: ' + ${topic.imageName}">Tên ảnh</p>

            <!-- Hiển thị ảnh -->
            <img th:src="@{/images/{img}(img=${topic.imageName})}"
                 class="card-img-top"
                 alt="Ảnh chủ đề"
                 style="height: 200px; object-fit: cover;" />

            <div class="card-body">
                <h5 class="card-title" th:text="${topic.title}">Tên chủ đề</h5>
            </div>
        </div>
    </div>
</div>


    <div class="text-center mt-4">
        <a th:href="@{/admin/topics/create}" class="btn btn-primary">+ Thêm chủ đề mới</a>
    </div>
</div>

</body>
</html>
