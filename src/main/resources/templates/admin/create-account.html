<!-- templates/create-account.html -->
<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Tạo tài khoản mới</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-900 text-white p-6">
  <h1 class="text-2xl font-bold mb-6">➕ Tạo tài khoản mới</h1>

  <form th:action="@{/admin/account/create}" method="post" class="max-w-md space-y-4">
    <div>
      <label class="block mb-1">Tên người dùng</label>
      <input type="text" name="username" class="w-full px-3 py-2 rounded bg-gray-800 text-white border border-gray-700" required>
    </div>

    <div>
      <label class="block mb-1">Email</label>
      <input type="email" name="email" class="w-full px-3 py-2 rounded bg-gray-800 text-white border border-gray-700" required>
    </div>

    <div>
      <label class="block mb-1">Mật khẩu</label>
      <input type="password" name="password" class="w-full px-3 py-2 rounded bg-gray-800 text-white border border-gray-700" required>
    </div>

    <div>
      <label class="block mb-1">Quyền</label>
      <select name="role" class="w-full px-3 py-2 rounded bg-gray-800 text-white border border-gray-700">
        <option value="admin">Admin</option>
        <option value="user">User</option>
      </select>
    </div>

    <button type="submit" class="bg-green-600 px-4 py-2 rounded hover:bg-green-500">Tạo tài khoản</button>
  </form>
</body>
</html>
