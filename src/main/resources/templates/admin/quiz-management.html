<!-- templates/quiz-management.html -->
<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Quản lý Quiz</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-900 text-white p-6">
  <h1 class="text-2xl font-bold mb-4">📝 Danh sách Quiz</h1>

  <table class="w-full table-auto border border-gray-600 rounded-xl">
    <thead class="bg-gray-800">
      <tr>
        <th class="p-3 text-left">ID</th>
        <th class="p-3 text-left">Tiêu đề</th>
        <th class="p-3 text-left">Môn học</th>
        <th class="p-3 text-left">Số câu hỏi</th>
        <th class="p-3 text-left">Thao tác</th>
      </tr>
    </thead>
    <tbody>
      <tr th:each="quiz : ${quizzes}" class="hover:bg-gray-800">
        <td class="p-3" th:text="${quiz.id}">1</td>
        <td class="p-3" th:text="${quiz.title}">Quiz 1</td>
        <td class="p-3" th:text="${quiz.subject}">Toán</td>
        <td class="p-3" th:text="${quiz.questionCount}">20</td>
        <td class="p-3 space-x-2">
          <a th:href="@{/admin/quiz/edit/{id}(id=${quiz.id})}" class="bg-blue-600 px-3 py-1 rounded hover:bg-blue-500">Sửa</a>
          <a th:href="@{/admin/quiz/delete/{id}(id=${quiz.id})}" class="bg-red-600 px-3 py-1 rounded hover:bg-red-500">Xóa</a>
        </td>
      </tr>
    </tbody>
  </table>
</body>
</html>
